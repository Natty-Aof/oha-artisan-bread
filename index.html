<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OHA Artisan Bread — ระบบบริหารร้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --terra:#C6644A; --terra-d:#A84F37; --terra-l:#F3DED6;
  --cream:#F6F1E8; --plaster:#E6E1DB; --olive:#7B846E; --olive-l:#E4E7DE;
  --ink:#2F3329; --ink2:#5C6055; --muted:#8E9086; --line:#E3DDD3; --card:#FFFDF9;
  --good:#4F7A4A; --good-l:#E2EDDF; --warn:#B7861F; --warn-l:#F6ECD3; --bad:#B23B2E; --bad-l:#F6DCD8;
  --r:14px; --shadow:0 1px 2px rgba(47,51,41,.06),0 4px 16px rgba(47,51,41,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans Thai',sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.en{font-family:'Jost',sans-serif}
/* ---------- logo ---------- */
.logo svg{display:block}
/* ---------- login ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:#241E1A}
.login-box{width:100%;max-width:380px;text-align:center;color:var(--cream)}
.login-box .logo{margin:0 auto 6px;width:220px}
.login-box .tag{letter-spacing:.42em;font-family:Jost;font-size:13px;color:#EDE6DA;margin-bottom:36px}
.login-card{background:var(--card);color:var(--ink);border-radius:20px;padding:24px;text-align:left}
.login-card h2{font-size:17px;font-weight:600;margin-bottom:14px}
.user-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.user-pick button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left;cursor:pointer}
.user-pick button.sel{border-color:var(--terra);background:var(--terra-l)}
.user-pick small{display:block;color:var(--muted);font-size:12px}
.pin-row{display:flex;gap:8px}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
/* ---------- shell ---------- */
#app{display:none;min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:236px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px}
.side .logo{padding:0 10px 4px;width:150px}
.side .tag{font-family:Jost;letter-spacing:.35em;font-size:10px;color:var(--ink2);padding:0 10px 22px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-weight:500;margin-bottom:2px;position:relative}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{background:var(--cream)}
.nav a.on{background:var(--terra-l);color:var(--terra-d)}
.nav .badge{margin-left:auto;background:var(--terra);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--olive);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.me .nm{font-weight:600;font-size:14px;line-height:1.2}
.me .nm,.me .rl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .rl{font-size:12px;color:var(--muted)}
.me button{flex:none}
main{margin-left:236px;padding:28px 32px 60px;max-width:1280px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
.topbar .sub{color:var(--muted);font-size:14px}
.mobile-head{display:none}
.bottom-nav{display:none}
/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}
.kpi .lb{font-size:13px;color:var(--ink2)}
.kpi .v{font-family:Jost;font-size:30px;font-weight:500;letter-spacing:-.01em;line-height:1.2;margin:4px 0 2px}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:400}
.kpi .d{font-size:12.5px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.p{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.p:hover{background:var(--terra-d)}
.btn.o{background:var(--olive);border-color:var(--olive);color:#fff}
.btn.g{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.g:hover{background:var(--cream)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--terra);box-shadow:0 0 0 3px var(--terra-l)}
label.f{display:block;font-size:13px;color:var(--ink2);margin-bottom:12px}
label.f>span{display:block;margin-bottom:4px;font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #EFEAE2;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;margin:0 -4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:99px;font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-l);color:var(--good)}
.pill.warn{background:var(--warn-l);color:#8A6412}
.pill.bad{background:var(--bad-l);color:var(--bad)}
.pill.neu{background:var(--plaster);color:var(--ink2)}
.pill.terra{background:var(--terra-l);color:var(--terra-d)}
.pill.olive{background:var(--olive-l);color:#525A45}
.pos-grid{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-bottom:14px}
.tile{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 8px 10px;cursor:pointer;text-align:left;transition:transform .08s}
.tile:active{transform:scale(.97)}.tile.on{border-color:var(--terra);background:#FFF8F4}
.tile img,.tile .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:var(--plaster)}
.tile .tn{font-weight:500;font-size:13.5px;margin-top:6px;line-height:1.3}.tile .tp{color:var(--terra-d);font-weight:500}
.tile .tl{font-size:11.5px;color:var(--muted)}.tile .tl.out{color:var(--bad)}
.tile .tq{position:absolute;top:4px;right:4px;background:var(--terra);color:#fff;border-radius:99px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.cart{position:sticky;top:16px}
.cline{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #EFEAE2}.cline .t{font-weight:500;font-size:14px}.cline .s{font-size:12px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px}
.cart-total{margin-top:10px;padding-top:10px;border-top:2px solid var(--ink);font-size:17px}.cart-total b{font-size:24px;color:var(--terra-d)}
.paybtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.paybtns button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 2px;cursor:pointer;font-size:13px;font-weight:500}
.paybtns button.on{border-color:var(--terra);background:var(--terra-l);color:var(--terra-d)}
@media (max-width:1100px){.pos-grid{grid-template-columns:1fr}.cart{position:static}}
@media (max-width:820px){.tiles{grid-template-columns:repeat(3,1fr);gap:8px}.tile .tn{font-size:12.5px}}
.roster td{padding:6px 4px;min-width:84px}.sc{border-left:3px solid;border-radius:6px;background:#fff;padding:3px 6px;font-size:11.5px;line-height:1.35;text-align:left}.sc b{font-weight:600}.sc .sn{color:var(--muted);font-size:10.5px}
table.pnl td,table.pnl th{padding:7px 8px;font-size:13px}table.pnl tr.sum td{border-top:1px solid var(--ink2);background:#FBF8F3}table.pnl tr.net td{border-top:2px solid var(--ink);background:var(--terra-l)}
.ocard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.ocard.late{border-color:#E8B4AC;background:#FDF6F4}
.sec-h{font-size:14px;font-weight:600;color:var(--ink2);margin:6px 0 10px;display:flex;gap:8px;align-items:center}
.mcard{border-radius:18px;padding:20px 22px;color:#fff;background:linear-gradient(135deg,#8E9681 0%,#6B735E 100%);box-shadow:0 10px 26px rgba(47,51,41,.18);position:relative;overflow:hidden}
.mcard.terra{background:linear-gradient(135deg,#D27759 0%,#A84F37 100%)}
.mcard.neu{background:linear-gradient(135deg,#3A322C 0%,#241E1A 100%)}
.mcard::after{content:'';position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
.mtier{font-family:Jost;letter-spacing:.2em;font-size:12px;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:2px 12px;text-transform:uppercase}
.mname{font-size:21px;font-weight:600;margin:22px 0 10px}
.mlbl{font-family:Jost;font-size:10px;letter-spacing:.2em;opacity:.75}
.mpts{font-size:30px;font-weight:500;line-height:1.1}
.tabs{display:inline-flex;background:var(--plaster);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #EFEAE2}
.list-item:last-child{border-bottom:0}
.list-item .t{font-weight:500}
.list-item .s{font-size:12.5px;color:var(--muted)}
.mb{margin-bottom:16px}
/* clock */
.clock-card{text-align:center;padding:30px 18px;background:linear-gradient(160deg,#fff 0%,var(--cream) 100%)}
.clock{font-family:Jost;font-size:58px;font-weight:300;letter-spacing:.02em;line-height:1}
.clock-date{color:var(--ink2);margin:8px 0 22px}
.big-btn{width:190px;height:190px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-size:20px;font-weight:600;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 10px 30px rgba(198,100,74,.35);transition:transform .1s}
.big-btn:active{transform:scale(.97)}
.big-btn.in{background:var(--terra)}
.big-btn.out{background:var(--olive);box-shadow:0 10px 30px rgba(123,132,110,.4)}
.big-btn small{font-weight:400;font-size:13px;opacity:.9}
.status-line{margin-top:18px;color:var(--ink2);font-size:14px}
.geo-line{margin-top:10px;font-size:12.5px;color:var(--muted)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--terra-l);border-top-color:var(--terra);margin:0 auto;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* bars */
.bar-wrap{position:relative}
.bar-wrap svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;z-index:5}
.meter{height:6px;background:var(--plaster);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;border-radius:99px;background:var(--olive)}
.meter>i.low{background:var(--bad)} .meter>i.mid{background:var(--warn)}
/* modal */
.mask{position:fixed;inset:0;background:rgba(36,30,26,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask.show{display:flex}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:22px}
.modal h2{font-size:18px;font-weight:600;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.2s;z-index:60;font-size:14px;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.prod-row{display:grid;grid-template-columns:1fr 90px 90px 34px;gap:8px;margin-bottom:8px}
.note{background:var(--olive-l);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink2)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:1fr}}
@media (max-width:820px){
  .side{display:none}
  main{margin:0;padding:16px 14px 96px}
  .mobile-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .mobile-head .logo{width:96px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}
  .bottom-nav a{flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:11px;color:var(--muted);text-decoration:none;position:relative}
  .bottom-nav a svg{width:21px;height:21px}
  .bottom-nav a.on{color:var(--terra)}
  .bottom-nav .badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--terra);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:15px}
  .g3,.g2{grid-template-columns:1fr}
  .kpi .v{font-size:25px}
  .topbar h1{font-size:20px}
  .clock{font-size:46px}
  .prod-row{grid-template-columns:1fr 70px 70px 30px}
  .hide-m{display:none}
  td,th{padding:8px 6px}
  td .btn.sm{padding:4px 8px}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login">
  <div class="login-box">
    <div class="logo" id="loginLogo"></div>
    <div class="tag">ARTISAN BREAD</div>
    <div id="bootMsg" style="display:none;color:#EDE6DA;text-align:center"></div>
    <div class="login-card">
      <h2>เข้าสู่ระบบ</h2>
      <div class="user-pick" id="userPick"></div>
      <div class="pin-row">
        <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="รหัส PIN">
        <button class="btn p" id="loginBtn" style="min-width:96px">เข้าระบบ</button>
      </div>
      <div class="hint" id="pinHint">PIN ตัวอย่าง: โอ้ 5678 · เอ้ 9012 · พี่โม 2468 · อ๊อฟ 1234 · เปรี้ยว 1111 · บีม 2222 · จ๋า 3333</div>
    </div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app">
  <aside class="side">
    <div class="logo" id="sideLogo"></div>
    <div class="tag">ARTISAN BREAD</div>
    <nav class="nav" id="nav"></nav>
    <div class="me" id="me"></div>
  </aside>
  <div class="mobile-head"><div class="logo" id="mLogo"></div><div class="row" id="mMe"></div></div>
  <main id="view"></main>
  <nav class="bottom-nav" id="bnav"></nav>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   OHA ARTISAN BREAD — Shop Management Prototype
   ข้อมูลเก็บในเบราว์เซอร์นี้ (localStorage) — ต้นแบบก่อนต่อ Google Sheets
   ========================================================= */
const KEY='oha-shop-v1';
const API_URL='https://script.google.com/macros/s/AKfycbzlFte9ssWJ2-mUaE1XEN5CwqI1TmT_LjJ80qhigyBVImUHLH4GF7stc_5mKWgxQM2kaA/exec';            // ← ใส่ URL ของ Apps Script Web App (ลงท้าย /exec) เพื่อใช้งานจริง
const LIVE=!!API_URL;
let DIRTY=0;
const DEMO_ITEMS=[
    ['แป้งขนมปัง T55','แป้ง','kg',42,20,38],['แป้งสาลีอเนกประสงค์','แป้ง','kg',18,15,32],['แป้งโฮลวีต','แป้ง','kg',6,8,55],
    ['เนยจืด (Unsalted)','นม/เนย','kg',5,10,320],['นมสด','นม/เนย','ลิตร',14,10,52],['ไข่ไก่ เบอร์ 1','นม/เนย','ฟอง',150,90,4.2],
    ['ยีสต์แห้ง','อื่นๆ','g',900,500,0.45],['น้ำตาลทราย','อื่นๆ','kg',20,10,26],['เกลือทะเล','อื่นๆ','kg',4,2,30],
    ['เนื้อวัวบด','ไส้','kg',3,4,290],['เห็ดแชมปิญอง','ไส้','kg',4,3,140],['ใบชา (Fruit Tea)','เครื่องดื่ม','g',800,300,1.2],
    ['ผลไม้รวม','เครื่องดื่ม','kg',3,2,90],['กล่อง/ถุงบรรจุภัณฑ์','บรรจุภัณฑ์','ชิ้น',220,150,3.5],['สติ๊กเกอร์ OHA','บรรจุภัณฑ์','ชิ้น',380,200,1.1]
  ];
const LIVE_ITEMS=[['แป้งขนมปัง','แป้ง/ธัญพืช','kg',0,20,0],['แป้งโฮลวีต','แป้ง/ธัญพืช','kg',0,5,0],['ธัญพืชรวม (Multigrain)','แป้ง/ธัญพืช','kg',0,2,0],['เนยจืด','นม/เนย/ไข่','kg',0,10,0],['นมสด','นม/เนย/ไข่','ลิตร',0,5,0],['ไข่ไก่','นม/เนย/ไข่','ฟอง',0,60,0],['ยีสต์','อื่นๆ','g',0,500,0],['น้ำตาลทราย','อื่นๆ','kg',0,5,0],['เกลือ','อื่นๆ','kg',0,2,0],['มะเดื่อแห้ง (Fig)','ส่วนผสมซาวโดว์','kg',0,1,0],['มะกอกดำ','ส่วนผสมซาวโดว์','kg',0,1,0],['ช็อกโกแลตชิป','ส่วนผสมซาวโดว์','kg',0,1,0],['เนื้อวัว','ไส้พาย','kg',0,3,0],['ไก่','ไส้พาย','kg',0,3,0],['พริกแกงมัสมั่น','ไส้พาย','kg',0,1,0],['กะทิ','ไส้พาย','ลิตร',0,2,0],['อบเชยป่น','อื่นๆ','g',0,200,0],['กล่อง/ถุงบรรจุภัณฑ์','บรรจุภัณฑ์','ชิ้น',0,100,0],['สติ๊กเกอร์ OHA','บรรจุภัณฑ์','ชิ้น',0,100,0]];
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());

const thDay=s=>new Date(s+'T00:00').toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'});
const thMonth=s=>new Date(s+'-01T00:00').toLocaleDateString('th-TH',{month:'long',year:'numeric'});

/* ---------- calc ---------- */
const saleTotal=s=>(+s.cash||0)+(+s.transfer||0)+(+s.card||0)+(+s.delivery||0)+(+s.other||0);
function sumSales(from,to){return SL().filter(s=>s.date>=from&&s.date<=to).reduce((a,s)=>a+saleTotal(s),0)}
function billsSum(from,to){return SL().filter(s=>s.date>=from&&s.date<=to).reduce((a,s)=>a+(+s.bills||0),0)}
function workHours(a){if(!a.out)return 0;return Math.max(0,(new Date(a.out)-new Date(a.in))/36e5)}
function netHours(a){const h=workHours(a),s=shiftOf(a.uid,a.date),b=s?(+s.brk||0):S.settings.breakHours;return h>5?h-b:h}
function isLate(a){const s=shiftOf(a.uid,a.date),st=s?s.start:S.settings.shiftStart;return toMin(hm(a.in))>toMin(st)+(+S.settings.graceMin||0)}
function otSuggest(a){const s=shiftOf(a.uid,a.date);return Math.max(0,netHours(a)-(s?shiftHrs(s):S.settings.stdHours))}
function pct(a,b){if(!b)return '';const p=(a-b)/b*100;return `<span class="${p>=0?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}%</span>`}
function pendingCount(){return S.leaves.filter(l=>l.status==='pending').length+S.ot.filter(o=>o.status==='pending').length}
function stockLevel(it){return it.qty<=it.min?'low':it.qty<=it.min*1.5?'mid':'ok'}

/* ---------- bar chart (single series, hover tooltip) ---------- */
function barChart(id,data,{h=200,fmtV=v=>'฿'+money(v)}={}){
  const el=document.getElementById(id); if(!el)return;
  const W=el.clientWidth||600, padL=46,padB=26,padT=10, iw=W-padL-6, ih=h-padB-padT;
  const max=Math.max(...data.map(d=>d.v),1); const step=niceStep(max/4); const top=Math.ceil(max/step)*step;
  const bw=iw/data.length, gap=Math.max(2,Math.min(10,bw*.28)), w=bw-gap;
  let g=''; for(let v=0;v<=top;v+=step){const y=padT+ih-(v/top)*ih;
    g+=`<line x1="${padL}" x2="${W-6}" y1="${y}" y2="${y}" stroke="#ECE6DC" stroke-width="1"/><text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#8E9086" font-family="Jost">${v>=1000?(v/1000)+'k':v}</text>`;}
  const every=Math.ceil(data.length/12);
  let b=''; data.forEach((d,i)=>{const x=padL+i*bw+gap/2, bh=Math.max(d.v?2:0,(d.v/top)*ih), y=padT+ih-bh, r=Math.min(4,w/2,bh);
    b+=`<path d="M${x},${padT+ih} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${padT+ih} Z" fill="${d.hl?'#C6644A':'#D99A86'}"/>`;
    b+=`<rect x="${padL+i*bw}" y="${padT}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}"/>`;
    if(i%every===0) b+=`<text x="${x+w/2}" y="${h-8}" text-anchor="middle" font-size="11" fill="#8E9086">${d.l}</text>`;});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${h}" height="${h}">${g}<line x1="${padL}" x2="${W-6}" y1="${padT+ih}" y2="${padT+ih}" stroke="#CFC8BC"/>${b}</svg><div class="tip"></div>`;
  const tip=el.querySelector('.tip');
  el.querySelectorAll('rect[data-i]').forEach(r=>{
    r.addEventListener('mouseenter',()=>{const d=data[+r.dataset.i];tip.innerHTML=`<b>${d.full||d.l}</b><br>${fmtV(d.v)}`;
      const x=+r.getAttribute('x')+bw/2, y=padT+ih-(d.v/top)*ih; tip.style.left=x/W*100+'%'; tip.style.top=y+'px'; tip.style.opacity=1;
      r.setAttribute('fill','rgba(198,100,74,.06)')});
    r.addEventListener('mouseleave',()=>{tip.style.opacity=0;r.setAttribute('fill','transparent')});
  });
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const n=x/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}

/* ---------- GPS check-in ---------- */
const G=()=>S.settings.geo;
function distM(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmtDist=m=>m<1000?Math.round(m)+' ม.':(m/1000).toFixed(1)+' กม.';
const mapUrl=l=>`https://www.google.com/maps?q=${l.lat},${l.lng}`;
function getPos(){return new Promise((res,rej)=>{const g=G();
  if(g.sim!=='off'){if(g.lat==null)return rej('ยังไม่ได้ตั้งตำแหน่งร้าน');const o=g.sim==='in'?0.00015:0.018;
    return setTimeout(()=>res({lat:g.lat+o,lng:g.lng+o/2,acc:g.sim==='in'?12:18,sim:true}),700)}
  try{if(!navigator.geolocation)return rej('อุปกรณ์/เบราว์เซอร์นี้ไม่รองรับ GPS');
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,sim:false}),
      e=>rej(e.code===1?'ไม่ได้รับอนุญาตให้เข้าถึงตำแหน่ง — กรุณาเปิดสิทธิ์ Location ให้เบราว์เซอร์ แล้วลองใหม่':e.code===3?'หาตำแหน่งไม่ทันเวลา — ลองออกไปที่โล่งหรือเปิด Wi-Fi แล้วลองใหม่':'หาตำแหน่งไม่ได้ — ตรวจว่าเปิด GPS/Location ในมือถือแล้ว'),
      {enableHighAccuracy:true,timeout:15000,maximumAge:0})}catch(e){rej('เบราว์เซอร์นี้บล็อกการเข้าถึงตำแหน่ง')}})}
function bearing(a,b,c,d){const r=x=>x*Math.PI/180,y=Math.sin(r(d-b))*Math.cos(r(c)),x=Math.cos(r(a))*Math.sin(r(c))-Math.sin(r(a))*Math.cos(r(c))*Math.cos(r(d-b));return (Math.atan2(y,x)*180/Math.PI+360)%360}
/* radar map: ร้านอยู่กลาง วงรัศมีที่อนุญาต และจุดตำแหน่งที่กด */
function radar(points,size=240){const g=G(),R=size/2-14,maxD=Math.max(g.radius*1.6,...points.map(p=>p.dist*1.15));
  const sc=d=>Math.min(R,d/maxD*R),fr=sc(g.radius);
  const dots=points.map(p=>{const r=sc(p.dist),a=(p.brg||0)*Math.PI/180,x=size/2+r*Math.sin(a),y=size/2-r*Math.cos(a),ar=Math.min(R,(p.acc||0)/maxD*R);
    return `<circle cx="${x}" cy="${y}" r="${ar}" fill="${p.ok?'rgba(79,122,74,.12)':'rgba(178,59,46,.12)'}"/><circle cx="${x}" cy="${y}" r="7" fill="${p.ok?'#4F7A4A':'#B23B2E'}" stroke="#fff" stroke-width="2.5"/>${p.label?`<text x="${x}" y="${y-12}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2F3329" paint-order="stroke" stroke="#FFFDF9" stroke-width="3">${esc(p.label)}</text>`:''}`}).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block;margin:0 auto;max-width:100%">
  <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="#F6F1E8" stroke="#E3DDD3"/><circle cx="${size/2}" cy="${size/2}" r="${R*0.5}" fill="none" stroke="#E3DDD3" stroke-dasharray="3 4"/>
  <circle cx="${size/2}" cy="${size/2}" r="${fr}" fill="rgba(123,132,110,.16)" stroke="#7B846E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="${size/2}" y="18" text-anchor="middle" font-size="10" fill="#8E9086" font-family="Jost">N</text>
  <text x="${size/2+fr+3}" y="${size/2-3}" font-size="10" fill="#5C6055">${g.radius} ม.</text>
  <circle cx="${size/2}" cy="${size/2}" r="11" fill="#C6644A"/><path d="M${size/2-5} ${size/2+4}L${size/2} ${size/2-5}L${size/2+5} ${size/2+4}" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  ${dots}<text x="${size/2}" y="${size-6}" text-anchor="middle" font-size="10" fill="#8E9086">ขอบวง ≈ ${fmtDist(maxD)}</text></svg>`}
function shrinkImg(file,max,cb){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.62))};im.src=rd.result};rd.readAsDataURL(file)}
function geoCheck(kind,done){const g=G(),label=kind==='in'?'เข้างาน':'ออกงาน',place=g.place||'OHA ARTISAN BREAD';
  if(g.lat==null)return modal(`<h2>ยังไม่ได้ตั้งตำแหน่งร้าน</h2><p style="margin-bottom:16px">เจ้าของร้านต้องตั้งพิกัดร้านก่อน ที่เมนู “พนักงาน & ตั้งค่า” → ตำแหน่งร้าน (GPS)</p><div class="row end"><button class="btn" onclick="closeModal()">ปิด</button></div>`);
  modal(`<div style="text-align:center;padding:20px 0"><div class="spin"></div><h2 style="margin:14px 0 4px">กำลังหาตำแหน่งของคุณ…</h2><p style="color:var(--muted);font-size:14px">กรุณากด “อนุญาต” หากมีหน้าต่างถามเรื่องตำแหน่ง</p></div>`);
  getPos().then(p=>{
    const d=distM(p.lat,p.lng,g.lat,g.lng), ok=d<=g.radius;
    const loc={lat:+p.lat.toFixed(6),lng:+p.lng.toFixed(6),acc:Math.round(p.acc),dist:Math.round(d),brg:Math.round(bearing(g.lat,g.lng,p.lat,p.lng)),ok,sim:p.sim,place,at:new Date().toISOString()};
    if(p.acc>g.maxAcc)return geoFail(kind,`สัญญาณ GPS ยังไม่แม่นพอ (คลาดเคลื่อน ±${Math.round(p.acc)} ม. เกณฑ์ ${g.maxAcc} ม.)<br>ลองออกไปที่โล่งหรือเปิด Wi-Fi แล้วกดใหม่`);
    if(!ok&&g.policy==='block')return geoFail(kind,`คุณอยู่ห่างจาก <b>${esc(place)}</b> <b>${fmtDist(d)}</b> (อนุญาตไม่เกิน ${g.radius} ม.)<br>ต้องอยู่ที่ร้านจึงจะลงเวลา${label}ได้`,loc);
    const needPhoto=kind==='in'&&g.selfie==='on';window._selfie='';
    modal(`<div style="text-align:center"><div style="font-size:13px;color:var(--muted)">เช็คอิน${label}ที่</div><h2 style="margin:2px 0 6px">📍 ${esc(place)}</h2>
      <div style="margin-bottom:6px">${ok?`<span class="pill good" style="font-size:13.5px">✓ อยู่ในพื้นที่ร้าน · ห่าง ${fmtDist(d)}</span>`:`<span class="pill bad" style="font-size:13.5px">⚠ อยู่นอกพื้นที่ร้าน · ห่าง ${fmtDist(d)}</span>`}</div>
      ${radar([{...loc,label:ME.name}])}
      <div style="font-size:12.5px;color:var(--muted);margin:4px 0 12px">เวลา ${hm(loc.at)} น. · ความแม่นยำ ±${loc.acc} ม.${p.sim?' · <b>โหมดจำลอง</b>':''} · <a href="${mapUrl(loc)}" target="_blank" style="color:var(--terra)">ดูบน Google Maps</a></div></div>
    ${needPhoto?`<label class="f"><span>ถ่ายรูปยืนยันที่ร้าน *</span></label><div class="row mb"><span id="sfP" style="width:64px;height:64px;border-radius:12px;background:var(--plaster);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden">📷</span><label class="btn" style="cursor:pointer">ถ่ายรูป / เลือกรูป<input type="file" accept="image/*" capture="user" style="display:none" onchange="shrinkImg(this.files[0],320,u=>{window._selfie=u;document.getElementById('sfP').innerHTML='<img src=\\''+u+'\\' style=\\'width:64px;height:64px;object-fit:cover\\'>'})"></label></div>`:''}
    ${ok?'':`<label class="f"><span>เหตุผลที่ลงเวลา${label}นอกร้าน *</span><textarea id="gR" rows="2" placeholder="เช่น ไปส่งออเดอร์ / ไปซื้อวัตถุดิบ"></textarea></label>`}
    <div class="row end"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="gOk" style="min-width:160px">ยืนยันเช็คอิน${label}</button></div>`,440);
    document.getElementById('gOk').onclick=()=>{if(!ok){const r=val('gR').trim();if(!r)return toast('ระบุเหตุผล');loc.reason=r}
      if(needPhoto&&!window._selfie)return toast('ถ่ายรูปยืนยันก่อน');if(needPhoto)loc.photo=window._selfie;
      loc.at=new Date().toISOString();done(loc)};
  }).catch(m=>geoFail(kind,m));
}
function testLoc(){const g=G();modal(`<div style="text-align:center;padding:20px 0"><div class="spin"></div><h2 style="margin:14px 0 4px">กำลังหาตำแหน่ง…</h2><p style="color:var(--muted);font-size:14px">ถ้ามีหน้าต่างถามเรื่องตำแหน่ง ให้กด “อนุญาต”</p></div>`);
  getPos().then(p=>{const d=distM(p.lat,p.lng,g.lat,g.lng),ok=d<=g.radius,accOk=p.acc<=g.maxAcc,loc={lat:p.lat,lng:p.lng,acc:Math.round(p.acc),dist:Math.round(d),brg:Math.round(bearing(g.lat,g.lng,p.lat,p.lng)),ok};
    modal(`<div style="text-align:center"><div style="font-size:13px;color:var(--muted)">ทดสอบตำแหน่ง — ไม่มีการบันทึกเวลา</div><h2 style="margin:4px 0 8px">${ok&&accOk?'✅ ลงเวลาที่จุดนี้ได้':'❌ ลงเวลาที่จุดนี้ไม่ได้'}</h2>
    ${radar([{...loc,label:'คุณ'}])}
    <div style="font-size:14px;line-height:1.9;margin:6px 0 14px">ห่างจาก ${esc(g.place||'ร้าน')} <b>${fmtDist(d)}</b> (อนุญาต ${g.radius} ม.) ${ok?'<span class="pill good">ในรัศมี</span>':'<span class="pill bad">นอกรัศมี</span>'}<br>ความแม่นยำ GPS ±${Math.round(p.acc)} ม. (เกณฑ์ ${g.maxAcc} ม.) ${accOk?'<span class="pill good">ผ่าน</span>':'<span class="pill bad">ไม่แม่นพอ</span>'}
    ${!accOk?'<div class="note" style="margin-top:8px;text-align:left">คอมพิวเตอร์ไม่มี GPS จะเดาตำแหน่งจาก Wi-Fi/อินเทอร์เน็ต จึงคลาดเคลื่อนมาก — ให้ทดสอบด้วยมือถือที่เปิด Location</div>':''}
    <br><a href="${mapUrl(loc)}" target="_blank" style="color:var(--terra)">ดูตำแหน่งนี้บน Google Maps</a></div></div>
    <div class="row end"><button class="btn" onclick="closeModal()">ปิด</button><button class="btn p" onclick="testLoc()">ทดสอบอีกครั้ง</button></div>`,440)
  }).catch(m=>modal(`<h2 style="color:var(--bad)">หาตำแหน่งไม่ได้</h2><p style="line-height:1.7;margin-bottom:12px">${m}</p><div class="note" style="margin-bottom:14px">วิธีแก้: กดไอคอน 📍 หรือ 🔒 ที่แถบที่อยู่เว็บ → ตำแหน่ง (Location) → อนุญาต แล้วโหลดหน้าใหม่ · บนมือถือให้เปิด Location ของเครื่อง และอนุญาตให้เบราว์เซอร์ใช้ตำแหน่ง</div><div class="row end"><button class="btn" onclick="closeModal()">ปิด</button><button class="btn p" onclick="testLoc()">ลองใหม่</button></div>`,440))}
function geoFail(kind,msg,loc){modal(`<h2 style="color:var(--bad)">ลงเวลาไม่สำเร็จ</h2><p style="margin-bottom:10px;line-height:1.7">${msg}</p>${/อนุญาต|บล็อก/.test(msg)?'<div class="note" style="margin-bottom:12px">กดไอคอน 📍 หรือ 🔒 ที่แถบที่อยู่เว็บ → ตำแหน่ง (Location) → อนุญาต แล้วโหลดหน้าใหม่</div>':''}${loc?radar([{...loc,label:'คุณ'}],200)+`<p style="font-size:13px;margin:8px 0 14px;text-align:center"><a href="${mapUrl(loc)}" target="_blank" style="color:var(--terra)">ดูตำแหน่งของคุณบน Google Maps →</a></p>`:''}
  <div class="row end"><button class="btn" onclick="closeModal()">ปิด</button><button class="btn p" onclick="${kind==='in'?'clockIn()':'clockOut(1)'}">ลองใหม่</button></div>`,440)}
function clockIn(){geoCheck('in',loc=>{S.attendance.push({id:uid(),uid:ME.id,date:today(),in:loc.at,out:null,inLoc:loc});save();closeModal();toast('เช็คอินเข้างานแล้ว ✓ '+(loc.ok?esc(loc.place)+' ('+fmtDist(loc.dist)+')':'นอกพื้นที่ — แจ้งเจ้าของแล้ว'));rerender()})}
function clockOut(){geoCheck('out',loc=>{const a=S.attendance.find(x=>x.uid===ME.id&&x.date===today());a.out=loc.at;a.outLoc=loc;save();closeModal();toast('เช็คอินออกงานแล้ว ✓ '+(loc.ok?esc(loc.place)+' ('+fmtDist(loc.dist)+')':'นอกพื้นที่ — แจ้งเจ้าของแล้ว'));rerender()})}
function locPill(l,manual){if(!l)return manual?'<span class="pill neu">แก้ไขโดยเจ้าของ</span>':'<span style="color:var(--muted)">—</span>';
  return `<a href="${mapUrl(l)}" target="_blank" style="text-decoration:none" title="${esc(l.place||'')} ±${l.acc} ม.${l.reason?' · เหตุผล: '+esc(l.reason):''}"><span class="pill ${l.ok?'good':'bad'}">${l.ok?'📍 ที่ร้าน':'⚠ นอกร้าน'} ${fmtDist(l.dist)}${l.sim?' · จำลอง':''}</span></a>${l.photo?' '+photoTag(l.photo,24):''}${l.reason?`<div style="font-size:11.5px;color:var(--muted);margin-top:2px">${esc(l.reason)}</div>`:''}`}
function viewPhoto(src){modal(`<img src="${src}" style="width:100%;border-radius:12px;display:block"><div class="row end" style="margin-top:12px"><button class="btn" onclick="closeModal()">ปิด</button></div>`,380)}
function dayMap(d){const pts=[];S.attendance.filter(a=>a.date===d).forEach(a=>{const n=U(a.uid).name;if(a.inLoc)pts.push({...a.inLoc,label:n+' เข้า',who:n,k:'เข้า',t:a.in});if(a.outLoc)pts.push({...a.outLoc,label:'',who:n,k:'ออก',t:a.out})});
  modal(`<h2>แผนที่เช็คอิน — ${thDate(d)}</h2>${pts.length?radar(pts,300):'<div class="empty">ไม่มีข้อมูลตำแหน่งวันนี้</div>'}
  <div style="margin-top:10px">${pts.map(p=>`<div class="list-item" style="padding:7px 0">${photoTag(p.photo,36)}<div class="sp"><div class="t">${esc(p.who)} · ${p.k}งาน ${hm(p.t)}</div><div class="s">${esc(p.place||'')} · ±${p.acc} ม.${p.reason?' · '+esc(p.reason):''}</div></div><span style="flex:none">${locPill({...p,photo:null,reason:null})}</span></div>`).join('')}</div>
  <div class="row end" style="margin-top:12px"><button class="btn" onclick="closeModal()">ปิด</button></div>`,460)}
const offsite=a=>(a.inLoc&&!a.inLoc.ok)||(a.outLoc&&!a.outLoc.ok);
function timeOwner(){
  const d=ui.timeDate, mo=ui.timeMonth; const staff=S.users.filter(u=>u.role==='staff');
  const rows=staff.map(u=>{const a=S.attendance.find(x=>x.uid===u.id&&x.date===d);const lv=S.leaves.find(l=>l.uid===u.id&&l.status==='approved'&&l.from<=d&&l.to>=d);return {u,a,lv}});
  const sum=staff.map(u=>{const m=S.attendance.filter(x=>x.uid===u.id&&x.date.startsWith(mo));
    const dim=[...Array(31)].map((_,i)=>mo+'-'+pad(i+1)).filter(x=>x.slice(0,7)===mo&&!isNaN(new Date(x+'T00:00'))&&x<=today()),sched=dim.filter(x=>shiftOf(u.id,x)).length,abs=dim.filter(x=>shiftOf(u.id,x)&&x<today()&&!m.some(a=>a.date===x)&&!S.leaves.some(l=>l.uid===u.id&&l.status==='approved'&&l.from<=x&&l.to>=x)).length;
    return {u,sched,abs,days:m.length,hrs:m.reduce((s,x)=>s+netHours(x),0),late:m.filter(isLate).length,
      ot:S.ot.filter(o=>o.uid===u.id&&o.status==='approved'&&o.date.startsWith(mo)).reduce((s,o)=>s+ +o.hours,0),
      lv:S.leaves.filter(l=>l.uid===u.id&&l.status==='approved'&&l.from.startsWith(mo)).reduce((s,l)=>s+l.days,0),off:m.filter(offsite).length,man:m.filter(x=>x.editedBy).length}});
  return head('ลงเวลาพนักงาน','ตรวจเวลาเข้า–ออก มาสาย และชั่วโมงทำงาน')+`
  <div class="card mb"><h3>รายวัน<span class="r row"><button class="btn sm" onclick="dayMap('${d}')">🗺 แผนที่เช็คอิน</button><input type="date" value="${d}" style="width:auto" onchange="ui.timeDate=this.value;rerender()"></span></h3>
  <div class="tbl"><table><tr><th>พนักงาน</th><th>กะ</th><th>เข้า</th><th>ออก</th><th class="n">ชม.สุทธิ</th><th>สถานะ</th><th>ตำแหน่ง เข้า / ออก</th><th></th></tr>
  ${rows.map(({u,a,lv})=>`<tr><td><b>${esc(u.name)}</b><div style="font-size:12px;color:var(--muted)">${u.empType==='extra'?'Extra':esc(u.pos)}</div></td><td>${shiftPill(shiftOf(u.id,d))}</td><td>${a?hm(a.in):'—'}</td><td>${a&&a.out?hm(a.out):'—'}</td><td class="n">${a&&a.out?num(netHours(a)):'—'}</td>
  <td>${lv?`<span class="pill neu">${lv.type}</span>`:!a?(shiftOf(u.id,d)?(d<today()||(d===today()&&hm(new Date().toISOString())>shiftOf(u.id,d).start)?'<span class="pill bad">ขาด / ยังไม่เข้า</span>':'<span class="pill neu">ยังไม่ถึงกะ</span>'):'<span class="pill neu">วันหยุด</span>'):(isLate(a)?'<span class="pill warn">สาย</span>':'<span class="pill good">ตรงเวลา</span>')+(!a.out?' <span class="pill terra">กำลังทำงาน</span>':'')+(a&&otSuggest(a)>0.25?` <span class="pill terra">เกิน ${num(otSuggest(a))} ชม.</span>`:'')}</td>
  <td>${a?locPill(a.inLoc,a.editedBy)+' '+(a.outLoc?locPill(a.outLoc):''):'—'}</td><td class="n"><button class="btn sm g" onclick="editAtt('${u.id}','${d}')">แก้ไข</button></td></tr>`).join('')}</table></div></div>
  <div class="card"><h3>สรุปรายเดือน<span class="r"><input type="month" value="${mo}" style="width:auto" onchange="ui.timeMonth=this.value;rerender()"></span></h3>
  <div class="tbl"><table><tr><th>พนักงาน</th><th class="n">ตามตาราง</th><th class="n">มาทำงาน</th><th class="n">ขาด</th><th class="n">ชม.สุทธิ</th><th class="n">มาสาย</th><th class="n">OT อนุมัติ</th><th class="n">วันลา</th><th class="n">นอกพื้นที่</th><th class="n">แก้ไขโดยเจ้าของ</th></tr>
  ${sum.map(s=>`<tr><td><b>${esc(s.u.name)}</b></td><td class="n">${s.sched}</td><td class="n">${s.days}</td><td class="n">${s.abs?`<span class="pill bad">${s.abs}</span>`:0}</td><td class="n">${num(s.hrs)}</td><td class="n">${s.late?`<span class="pill warn">${s.late}</span>`:0}</td><td class="n">${num(s.ot)} ชม.</td><td class="n">${s.lv}</td><td class="n">${s.off?`<span class="pill bad">${s.off}</span>`:0}</td><td class="n">${s.man}</td></tr>`).join('')}</table></div>
  <div class="note" style="margin-top:12px">มาสาย = เข้าหลังเวลาเริ่มกะของคนนั้นในวันนั้นเกิน ${S.settings.graceMin} นาที · ชั่วโมงเกินกะ = ทำงานเกินชั่วโมงของกะ · จัดกะได้ที่เมนู “ตารางกะ”</div></div>`;
}
function editAtt(u,d){const a=S.attendance.find(x=>x.uid===u&&x.date===d);
  modal(`<h2>แก้ไขเวลา — ${esc(U(u).name)} · ${thDate(d)}</h2><div class="grid g2"><label class="f"><span>เข้างาน</span><input type="time" id="eIn" value="${a?hm(a.in):''}"></label><label class="f"><span>ออกงาน</span><input type="time" id="eOut" value="${a&&a.out?hm(a.out):''}"></label></div>
  <div class="row end">${a?'<button class="btn danger g" id="eDel">ลบบันทึก</button><span class="sp"></span>':''}<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="eOk">บันทึก</button></div>`);
  document.getElementById('eOk').onclick=()=>{const i=val('eIn'),o=val('eOut');if(!i)return toast('ระบุเวลาเข้า');
    const iso=x=>new Date(d+'T'+x+':00').toISOString();
    if(a){a.in=iso(i);a.out=o?iso(o):null;a.editedBy=ME.id}else S.attendance.push({id:uid(),uid:u,date:d,in:iso(i),out:o?iso(o):null,editedBy:ME.id});
    save();closeModal();toast('บันทึกแล้ว');rerender()};
  if(a)document.getElementById('eDel').onclick=()=>{S.attendance=S.attendance.filter(x=>x!==a);save();closeModal();rerender()};
}

/* ================= LEAVE / OT ================= */
VIEWS.leave=()=>{
  const own=isOwner(); const yr=today().slice(0,4);
  const lv=(own?S.leaves:S.leaves.filter(l=>l.uid===ME.id)).slice().sort((a,b)=>b.from.localeCompare(a.from));
  const ot=(own?S.ot:S.ot.filter(o=>o.uid===ME.id)).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const used=(u,t)=>S.leaves.filter(l=>l.uid===u&&l.type===t&&l.status==='approved'&&l.from.startsWith(yr)).reduce((s,l)=>s+l.days,0);
  const act=(k,x)=>own&&x.status==='pending'?`<button class="btn sm o" onclick="decide('${k}','${x.id}','approved')">อนุมัติ</button> <button class="btn sm g danger" onclick="decide('${k}','${x.id}','rejected')">ไม่อนุมัติ</button>`:(!own&&x.status==='pending'?`<button class="btn sm g danger" onclick="cancelReq('${k}','${x.id}')">ยกเลิก</button>`:'');
  const quota=own?'':`<div class="grid g3 mb">${Object.entries(S.settings.quota).map(([t,q])=>{const u=used(ME.id,t);return `<div class="card kpi"><div class="lb">${t} (ปี ${+yr+543})</div><div class="v">${q-u} <small>/ ${q} วัน คงเหลือ</small></div><div class="meter" style="margin-top:8px"><i style="width:${Math.min(100,u/q*100)}%"></i></div></div>`}).join('')}</div>`;
  return head(own?'การลา & OT':'ขอลา / ขอ OT',own?'อนุมัติคำขอของพนักงาน':'ส่งคำขอให้เจ้าของร้านอนุมัติ',
   `<button class="btn" onclick="openOT()">+ ขอ OT</button><button class="btn p" onclick="openLeave()">+ ขอลา</button>`)+quota+`
  <div class="card mb"><h3>คำขอลา</h3><div class="tbl"><table><tr>${own?'<th>พนักงาน</th>':''}<th>ประเภท</th><th>วันที่</th><th class="n">วัน</th><th>เหตุผล</th><th>สถานะ</th><th></th></tr>
  ${lv.map(l=>`<tr>${own?`<td><b>${esc(U(l.uid).name)}</b></td>`:''}<td>${l.type}</td><td>${thDate(l.from)}${l.to!==l.from?' – '+thDate(l.to):''}</td><td class="n">${l.days}</td><td>${esc(l.reason)}</td><td>${statusPill(l.status)}</td><td class="n" style="white-space:nowrap">${act('leave',l)}</td></tr>`).join('')||`<tr><td colspan="7" class="empty">ยังไม่มีคำขอลา</td></tr>`}
  </table></div></div>
  <div class="card"><h3>คำขอทำงานล่วงเวลา (OT)</h3><div class="tbl"><table><tr>${own?'<th>พนักงาน</th>':''}<th>วันที่</th><th class="n">ชั่วโมง</th><th>เหตุผล / งาน</th><th>สถานะ</th><th></th></tr>
  ${ot.map(o=>`<tr>${own?`<td><b>${esc(U(o.uid).name)}</b></td>`:''}<td>${thDate(o.date)}</td><td class="n">${num(o.hours)}</td><td>${esc(o.reason)}</td><td>${statusPill(o.status)}</td><td class="n" style="white-space:nowrap">${act('ot',o)}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">ยังไม่มีคำขอ OT</td></tr>`}
  </table></div></div>`;
};
function whoField(){return isOwner()?`<label class="f"><span>พนักงาน</span><select id="fWho">${S.users.filter(u=>u.role==='staff').map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label>`:''}
function openLeave(){const t=today();
  modal(`<h2>ขอลา</h2>${whoField()}<label class="f"><span>ประเภทการลา</span><select id="lType">${Object.keys(S.settings.quota).map(k=>`<option>${k}</option>`).join('')}</select></label>
  <div class="grid g2"><label class="f"><span>ตั้งแต่</span><input type="date" id="lFrom" value="${t}"></label><label class="f"><span>ถึง</span><input type="date" id="lTo" value="${t}"></label></div>
  <label class="f"><span>เหตุผล</span><textarea id="lReason" rows="2"></textarea></label>
  <div class="row end"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="lOk">ส่งคำขอ</button></div>`);
  document.getElementById('lOk').onclick=()=>{const f=val('lFrom'),to=val('lTo');if(!f||!to||to<f)return toast('ตรวจสอบช่วงวันที่');if(!val('lReason').trim())return toast('ระบุเหตุผล');
    S.leaves.push({id:uid(),uid:isOwner()?val('fWho'):ME.id,type:val('lType'),from:f,to,days:daysBetween(f,to),reason:val('lReason').trim(),status:isOwner()?'approved':'pending',at:new Date().toISOString()});
    save();closeModal();toast(isOwner()?'บันทึกการลาแล้ว':'ส่งคำขอลาแล้ว รอเจ้าของร้านอนุมัติ');if(route!=='leave')go('leave');else rerender()};
}
function openOT(date,hrs){
  modal(`<h2>ขอทำงานล่วงเวลา (OT)</h2>${whoField()}<div class="grid g2"><label class="f"><span>วันที่</span><input type="date" id="oDate" value="${date||today()}"></label><label class="f"><span>จำนวนชั่วโมง</span><input type="number" step="0.5" min="0.5" id="oHrs" value="${hrs||1}"></label></div>
  <label class="f"><span>เหตุผล / งานที่ทำ</span><textarea id="oReason" rows="2" placeholder="เช่น ออเดอร์จัดเลี้ยง, เตรียมโดว์ล่วงหน้า"></textarea></label>
  <div class="row end"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="oOk">ส่งคำขอ</button></div>`);
  document.getElementById('oOk').onclick=()=>{const h=+val('oHrs');if(!(h>0))return toast('ระบุชั่วโมง');if(!val('oReason').trim())return toast('ระบุเหตุผล');
    S.ot.push({id:uid(),uid:isOwner()?val('fWho'):ME.id,date:val('oDate'),hours:h,reason:val('oReason').trim(),status:isOwner()?'approved':'pending',at:new Date().toISOString()});
    save();closeModal();toast(isOwner()?'บันทึก OT แล้ว':'ส่งคำขอ OT แล้ว');if(route!=='leave')go('leave');else rerender()};
}
function cancelReq(k,id){if(k==='ot')S.ot=S.ot.filter(x=>x.id!==id);else S.leaves=S.leaves.filter(x=>x.id!==id);save();toast('ยกเลิกคำขอแล้ว');rerender()}

/* ================= STOCK ================= */
VIEWS.stock=()=>{
  const own=isOwner(); const f=ui.stockFilter;
  const cats=[...new Set(S.items.map(i=>i.cat))];
  let list=S.items.slice().sort((a,b)=>({low:0,mid:1,ok:2}[stockLevel(a)]-{low:0,mid:1,ok:2}[stockLevel(b)])||a.name.localeCompare(b.name,'th'));
  if(f==='low')list=list.filter(i=>stockLevel(i)!=='ok'); else if(f!=='all')list=list.filter(i=>i.cat===f);
  const nLow=S.items.filter(i=>stockLevel(i)==='low').length;
  const moves=S.moves.slice(-30).reverse();
  return head('สต็อกวัตถุดิบ',`${S.items.length} รายการ · ต่ำกว่าขั้นต่ำ ${nLow} รายการ`,own?`<button class="btn danger" id="bulkDel" style="display:none" onclick="bulkDelItems()">🗑 ลบที่เลือก</button><button class="btn p" onclick="editItem()">+ เพิ่มวัตถุดิบ</button>`:'')+`
  <div class="row mb"><div class="tabs"><button class="${f==='all'?'on':''}" onclick="ui.stockFilter='all';rerender()">ทั้งหมด</button><button class="${f==='low'?'on':''}" onclick="ui.stockFilter='low';rerender()">ใกล้หมด</button></div>
  <select style="width:auto" onchange="ui.stockFilter=this.value;rerender()"><option value="all">ทุกหมวด</option>${cats.map(c=>`<option ${f===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="card mb"><div class="tbl"><table><tr>${own?'<th style="width:28px"><input type="checkbox" title="เลือกทั้งหมด" style="width:auto" onchange="document.querySelectorAll(\'.itSel\').forEach(c=>c.checked=this.checked);selCount()"></th>':''}<th>วัตถุดิบ</th><th class="hide-m">หมวด</th><th class="n">คงเหลือ</th><th style="min-width:110px">ระดับ</th>${own?'<th class="n">ต้นทุน/หน่วย</th><th class="n">มูลค่า</th>':''}<th></th></tr>
  ${list.map(i=>{const lv=stockLevel(i);return `<tr>${own?`<td><input type="checkbox" class="itSel" value="${i.id}" style="width:auto" onchange="selCount()"></td>`:''}<td><b>${esc(i.name)}</b></td><td class="hide-m"><span class="pill neu">${esc(i.cat)}</span></td><td class="n"><b class="en">${num(i.qty)}</b> ${esc(i.unit)}</td>
  <td><div class="meter"><i class="${lv==='low'?'low':lv==='mid'?'mid':''}" style="width:${Math.min(100,i.qty/(i.min*3)*100)}%"></i></div><div style="font-size:11.5px;color:var(--muted);margin-top:3px">${lv==='low'?'⚠ ต่ำกว่าขั้นต่ำ':lv==='mid'?'ใกล้ขั้นต่ำ':'ปกติ'} · ขั้นต่ำ ${num(i.min)}</div></td>
  ${own?`<td class="n">฿${num(i.cost,2)}</td><td class="n">฿${money(i.qty*i.cost)}</td>`:''}
  <td class="n" style="white-space:nowrap"><button class="btn sm" onclick="moveItem('${i.id}','in')">รับเข้า</button> <button class="btn sm" onclick="moveItem('${i.id}','out')">เบิกใช้</button>${own?` <button class="btn sm g" onclick="editItem('${i.id}')">แก้ไข</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">ไม่มีรายการ</td></tr>'}
  </table></div></div>
  <div class="card"><h3>ความเคลื่อนไหวล่าสุด</h3><div class="tbl"><table><tr><th>เวลา</th><th>วัตถุดิบ</th><th>ประเภท</th><th class="n">จำนวน</th><th>โดย</th><th>หมายเหตุ</th></tr>
  ${moves.map(m=>{const it=S.items.find(i=>i.id===m.itemId)||{name:'(ลบแล้ว)',unit:''};return `<tr><td>${thDate(m.at.slice(0,10))} ${hm(m.at)}</td><td>${esc(it.name)}</td><td>${m.type==='in'?'<span class="pill good">รับเข้า</span>':m.type==='out'?'<span class="pill terra">เบิกใช้</span>':'<span class="pill neu">ปรับยอด</span>'}</td><td class="n">${m.type==='out'?'-':'+'}${num(m.qty)} ${esc(it.unit)}</td><td>${esc(U(m.uid).name)}</td><td>${esc(m.note)}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">ยังไม่มีการรับเข้า/เบิกใช้</td></tr>'}
  </table></div></div>`;
};
function selCount(){const n=document.querySelectorAll('.itSel:checked').length,b=document.getElementById('bulkDel');if(b){b.style.display=n?'':'none';b.textContent='🗑 ลบที่เลือก ('+n+')'}}
function bulkDelItems(){const ids=[...document.querySelectorAll('.itSel:checked')].map(c=>c.value);if(!ids.length)return;
  const names=S.items.filter(i=>ids.includes(i.id)).map(i=>esc(i.name));
  confirmBox(`ลบวัตถุดิบ ${ids.length} รายการ?<div style="font-size:13px;color:var(--muted);margin-top:6px;max-height:140px;overflow:auto">${names.join(', ')}</div><div style="font-size:13px;color:var(--muted);margin-top:6px">ประวัติรับเข้า/เบิกใช้เดิมยังอยู่</div>`,()=>{S.items=S.items.filter(i=>!ids.includes(i.id));save();toast('ลบแล้ว '+ids.length+' รายการ');rerender()})}
function moveItem(id,type){const it=S.items.find(i=>i.id===id);
  modal(`<h2>${type==='in'?'รับเข้า':'เบิกใช้'} — ${esc(it.name)}</h2><p style="color:var(--muted);margin-bottom:12px">คงเหลือปัจจุบัน ${num(it.qty)} ${esc(it.unit)}</p>
  <label class="f"><span>จำนวน (${esc(it.unit)})</span><input type="number" step="any" min="0" id="mQty" autofocus></label>
  ${type==='in'&&isOwner()?`<label class="f"><span>ราคาต่อหน่วยครั้งนี้ (เว้นว่าง = ใช้ต้นทุนเดิม ฿${num(it.cost,2)})</span><input type="number" step="any" id="mCost"></label>`:''}
  <label class="f"><span>หมายเหตุ</span><input id="mNote" placeholder="${type==='in'?'เช่น ร้านค้า / เลขที่บิล':'เช่น ใช้ทำครัวซองต์รอบเช้า'}"></label>
  <div class="row end"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="mOk">บันทึก</button></div>`);
  document.getElementById('mOk').onclick=()=>{const q=+val('mQty');if(!(q>0))return toast('ระบุจำนวน');
    if(type==='out'&&q>it.qty)return toast('จำนวนเบิกมากกว่าคงเหลือ');
    if(type==='in'){const c=document.getElementById('mCost');if(c&&c.value){it.cost=((it.qty*it.cost)+(q*+c.value))/(it.qty+q)}it.qty+=q}else it.qty-=q;
    it.qty=Math.round(it.qty*1000)/1000;
    S.moves.push({id:uid(),itemId:id,type,qty:q,note:val('mNote'),uid:ME.id,at:new Date().toISOString()});save();closeModal();toast('บันทึกแล้ว');rerender()};
}
function editItem(id){const it=id?S.items.find(i=>i.id===id):{name:'',cat:'',unit:'',qty:0,min:0,cost:0};
  const cats=[...new Set(S.items.map(i=>i.cat))];
  modal(`<h2>${id?'แก้ไข':'เพิ่ม'}วัตถุดิบ</h2><label class="f"><span>ชื่อวัตถุดิบ</span><input id="iName" value="${esc(it.name)}"></label>
  <div class="grid g2"><label class="f"><span>หมวด</span><input id="iCat" list="catList" value="${esc(it.cat)}"><datalist id="catList">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label><label class="f"><span>หน่วย</span><input id="iUnit" value="${esc(it.unit)}" placeholder="kg, g, ลิตร, ฟอง"></label>
  <label class="f"><span>คงเหลือ</span><input type="number" step="any" id="iQty" value="${it.qty}"></label><label class="f"><span>ขั้นต่ำ (แจ้งเตือน)</span><input type="number" step="any" id="iMin" value="${it.min}"></label></div>
  <label class="f"><span>ต้นทุนต่อหน่วย (บาท)</span><input type="number" step="any" id="iCost" value="${it.cost}"></label>
  <div class="row end">${id?'<button class="btn g danger" id="iDel">ลบ</button><span class="sp"></span>':''}<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="iOk">บันทึก</button></div>`);
  document.getElementById('iOk').onclick=()=>{if(!val('iName').trim()||!val('iUnit').trim())return toast('ระบุชื่อและหน่วย');
    const nq=+val('iQty');
    const o={name:val('iName').trim(),cat:val('iCat').trim()||'อื่นๆ',unit:val('iUnit').trim(),qty:nq,min:+val('iMin'),cost:+val('iCost')};
    if(id){if(nq!==it.qty)S.moves.push({id:uid(),itemId:id,type:'adj',qty:Math.abs(nq-it.qty),note:'ปรับยอด '+num(it.qty)+' → '+num(nq),uid:ME.id,at:new Date().toISOString()});Object.assign(it,o)}else S.items.push({id:uid(),...o});
    save();closeModal();toast('บันทึกแล้ว');rerender()};
  if(id)document.getElementById('iDel').onclick=()=>confirmBox('ลบ “'+esc(it.name)+'” ออกจากสต็อก?',()=>{S.items=S.items.filter(i=>i.id!==id);save();rerender()});
}

/* ================= DAILY REPORT ================= */
VIEWS.report=()=>{
  const own=isOwner(); const t=today();
  let list=(own?S.reports:S.reports.filter(r=>r.uid===ME.id)).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.at.localeCompare(a.at));
  if(ui.repDate)list=list.filter(r=>r.date===ui.repDate);
  const mineToday=S.reports.find(r=>r.uid===ME.id&&r.date===t);
  const staff=S.users.filter(u=>u.role==='staff'); const yd=addDays(t,-1);
  const missing=own?staff.filter(u=>!S.reports.some(r=>r.uid===u.id&&r.date===t)):[];
  return head('รายงานการทำงานประจำวัน',own?'ดูรายงานของทีมแต่ละวัน':'สรุปงานที่ทำวันนี้ก่อนออกงาน',
    `<input type="date" value="${ui.repDate}" style="width:auto" onchange="ui.repDate=this.value;rerender()" title="กรองตามวันที่">${ui.repDate?`<button class="btn g sm" onclick="ui.repDate='';rerender()">ล้าง</button>`:''}<button class="btn p" onclick="openReport()">${!own&&mineToday?'แก้ไขรายงานวันนี้':'+ เขียนรายงาน'}</button>`)+`
  ${own?`<div class="note mb">วันนี้ส่งแล้ว ${staff.length-missing.length}/${staff.length} คน${missing.length?' · ยังไม่ส่ง: '+missing.map(u=>esc(u.name)).join(', '):''}</div>`:''}
  ${list.map(r=>{const prod=r.produced.reduce((s,p)=>s+ +p.qty,0), waste=r.produced.reduce((s,p)=>s+ +(p.waste||0),0);
  return `<div class="card mb"><h3><div class="avatar" style="width:30px;height:30px;font-size:12px">${esc(U(r.uid).name[0])}</div>${esc(U(r.uid).name)} <span style="font-weight:400;color:var(--muted);font-size:13px">${thDay(r.date)}</span>
  <span class="r">${(r.uid===ME.id)?`<button class="btn sm g" onclick="openReport('${r.id}')">แก้ไข</button>`:''}</span></h3>
  ${r.produced.length?`<div class="tbl" style="margin-bottom:10px"><table><tr><th>สินค้าที่ผลิต</th><th class="n">ผลิต</th><th class="n">เสีย/เหลือทิ้ง</th></tr>${r.produced.map(p=>`<tr><td>${esc(p.name)}</td><td class="n">${num(p.qty)}</td><td class="n">${+p.waste?`<span class="pill bad">${num(p.waste)}</span>`:'0'}</td></tr>`).join('')}<tr><td><b>รวม</b></td><td class="n"><b>${num(prod)}</b></td><td class="n"><b>${num(waste)}</b> ${prod?`<span style="color:var(--muted);font-size:12px">(${(waste/prod*100).toFixed(1)}%)</span>`:''}</td></tr></table></div>`:''}
  <div style="white-space:pre-wrap"><b style="font-weight:500;color:var(--ink2)">งานที่ทำ:</b> ${esc(r.work)||'—'}</div>
  ${r.issues?`<div style="margin-top:8px;white-space:pre-wrap" class="note" ><b style="font-weight:500">ปัญหา / สิ่งที่ต้องแจ้ง:</b> ${esc(r.issues)}</div>`:''}</div>`}).join('')||'<div class="card empty">ยังไม่มีรายงาน</div>'}`;
};
function openReport(id){
  const ex=id?S.reports.find(r=>r.id===id):S.reports.find(r=>r.uid===ME.id&&r.date===today());
  const r=ex||{date:today(),produced:[],work:'',issues:''};
  const opts=v=>S.products.map(p=>`<option ${p===v?'selected':''}>${esc(p)}</option>`).join('');
  const prow=p=>`<div class="prod-row"><select class="pName">${opts(p.name)}</select><input type="number" class="pQty" min="0" placeholder="ผลิต" value="${p.qty??''}"><input type="number" class="pWaste" min="0" placeholder="เสีย" value="${p.waste??''}"><button class="btn sm g" onclick="this.parentNode.remove()">✕</button></div>`;
  window._prow=prow;
  modal(`<h2>รายงานประจำวัน</h2><label class="f"><span>วันที่</span><input type="date" id="rDate" value="${r.date}"></label>
  <label class="f"><span>สินค้าที่ผลิต / อบ (ถ้ามี)</span></label><div id="pRows">${r.produced.map(prow).join('')}</div>
  <button class="btn sm mb" onclick="document.getElementById('pRows').insertAdjacentHTML('beforeend',_prow({}))">+ เพิ่มสินค้า</button>
  <label class="f"><span>งานที่ทำวันนี้</span><textarea id="rWork" rows="3">${esc(r.work)}</textarea></label>
  <label class="f"><span>ปัญหา / สิ่งที่ต้องแจ้งเจ้าของร้าน</span><textarea id="rIss" rows="2" placeholder="เช่น วัตถุดิบใกล้หมด เครื่องมือชำรุด">${esc(r.issues)}</textarea></label>
  <div class="row end"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="rOk">บันทึกรายงาน</button></div>`);
  document.getElementById('rOk').onclick=()=>{
    const produced=[...document.querySelectorAll('#pRows .prod-row')].map(x=>({name:x.querySelector('.pName').value,qty:+x.querySelector('.pQty').value||0,waste:+x.querySelector('.pWaste').value||0})).filter(p=>p.qty||p.waste);
    if(!val('rWork').trim()&&!produced.length)return toast('กรอกงานที่ทำหรือสินค้าที่ผลิต');
    const o={date:val('rDate'),produced,work:val('rWork').trim(),issues:val('rIss').trim(),at:new Date().toISOString()};
    if(ex)Object.assign(ex,o);else S.reports.push({id:uid(),uid:ME.id,...o});
    save();closeModal();toast('บันทึกรายงานแล้ว');if(route!=='report')go('report');else rerender()};
}

/* ================= SALES ================= */
VIEWS.sales=()=>{
  const tab=ui.salesTab; const t=today();
  let rows=[];
  if(tab==='day'){for(let i=0;i<31;i++){const d=addDays(t,-i);const s=SL().find(x=>x.date===d);rows.push({k:d,l:thDay(d),s,tot:s?saleTotal(s):0,bills:s?+s.bills:0,parts:s})}}
  else if(tab==='week'){let ws=weekStart(t);for(let i=0;i<12;i++){const we=addDays(ws,6);const arr=SL().filter(x=>x.date>=ws&&x.date<=we);rows.push({k:ws,l:thDate(ws)+' – '+thDate(we),tot:arr.reduce((a,x)=>a+saleTotal(x),0),bills:arr.reduce((a,x)=>a+ +x.bills,0),days:arr.length,parts:agg(arr)});ws=addDays(ws,-7)}}
  else {const d=new Date(t+'T00:00');d.setDate(1);for(let i=0;i<12;i++){const m=ds(d).slice(0,7);const arr=SL().filter(x=>x.date.startsWith(m));rows.push({k:m,l:thMonth(m),tot:arr.reduce((a,x)=>a+saleTotal(x),0),bills:arr.reduce((a,x)=>a+ +x.bills,0),days:arr.length,parts:agg(arr)});d.setMonth(d.getMonth()-1)}}
  const withData=rows.filter(r=>r.tot); const sumT=withData.reduce((a,r)=>a+r.tot,0);
  const best=withData.reduce((m,r)=>r.tot>(m?.tot||0)?r:m,null);
  const P=r=>r.parts||{};
  const lbl={day:'วัน',week:'สัปดาห์',month:'เดือน'}[tab];
  return head('ยอดขาย','บันทึกยอดรายวัน ระบบสรุปรายสัปดาห์และรายเดือนให้อัตโนมัติ',`<button class="btn p" onclick="openSaleForm()">+ ลงยอดขาย</button>`)+`
  <div class="row mb"><div class="tabs">${[['day','รายวัน'],['week','รายสัปดาห์'],['month','รายเดือน']].map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="ui.salesTab='${k}';rerender()">${n}</button>`).join('')}</div></div>
  <div class="grid g3 mb">
    <div class="card kpi"><div class="lb">รวม ${withData.length} ${lbl}ที่มีข้อมูล</div><div class="v">฿${money(sumT)}</div></div>
    <div class="card kpi"><div class="lb">เฉลี่ยต่อ${lbl}</div><div class="v">฿${money(withData.length?sumT/withData.length:0)}</div></div>
    <div class="card kpi"><div class="lb">${lbl}ที่ขายดีที่สุด</div><div class="v" style="font-size:22px">${best?'฿'+money(best.tot):'—'}</div><div class="d">${best?best.l:''}</div></div>
  </div>
  <div class="card mb"><h3>ยอดขาย${{day:'รายวัน (31 วัน)',week:'รายสัปดาห์ (12 สัปดาห์)',month:'รายเดือน (12 เดือน)'}[tab]}</h3><div class="bar-wrap" id="sChart"></div></div>
  ${prodSalesCard()}

  ${tab==='day'?`<td class="n">${r.s&&r.s.src==='bills'?`<button class="btn sm g" onclick="ui.posDate='${r.k}';go('pos')">ดูบิล</button>`:`<button class="btn sm g" onclick="openSaleForm('${r.k}')">${r.s?'แก้ไข':'ลงยอด'}</button>`}</td>`:''}</tr>`).join('')}

function prodSalesCard(){const t=today(),from=addDays(t,-29),m={};let days=0;
  S.sales.filter(s=>s.date>=from&&s.items&&s.items.length).forEach(s=>{days++;s.items.forEach(i=>{const k=i.gid||('x:'+i.name);m[k]=m[k]||{name:i.gid?GG(i.gid).name:i.name,g:i.gid?GG(i.gid):null,qty:0,amt:0};m[k].qty+= +i.qty;m[k].amt+= +i.amount})});
  const L=Object.values(m).sort((a,b)=>b.amt-a.amt),mx=Math.max(1,...L.map(x=>x.amt)),tot=L.reduce((a,x)=>a+x.amt,0);
  return `<div class="card mb"><h3>ยอดขายตามสินค้า — 30 วันล่าสุด<span class="r">${days} วันที่มีรายสินค้า</span></h3>${L.length?L.map(x=>`<div style="display:grid;grid-template-columns:200px 1fr 70px 90px;gap:10px;align-items:center;margin-bottom:8px"><div class="row" style="gap:8px;flex-wrap:nowrap;font-size:14px">${x.g?thumb(x.g,24):''}${esc(x.name)}</div><div class="meter" style="height:12px"><i style="width:${x.amt/mx*100}%;background:var(--terra)"></i></div><span class="en" style="text-align:right">${num(x.qty)} ชิ้น</span><b class="en" style="text-align:right">฿${money(x.amt)}</b></div>`).join('')+`<div class="hint">รวม ฿${money(tot)} · ใช้ข้อมูลจาก “สรุปยอดขาย” ที่กรอกหรือนำเข้าจาก POS</div>`:'<div class="empty">ยังไม่มียอดขายรายสินค้า — ลงที่เมนู “สรุปยอดขาย” หรือนำเข้าไฟล์จาก POS</div>'}</div>`}
function agg(arr){return arr.reduce((a,x)=>({cash:a.cash+ +x.cash,transfer:a.transfer+ +x.transfer,card:a.card+ +x.card,delivery:a.delivery+ +x.delivery,other:a.other+(+x.other||0)}),{cash:0,transfer:0,card:0,delivery:0,other:0})}
AFTER.sales=()=>{const t=today(),tab=ui.salesTab,d=[];
  if(tab==='day')for(let i=30;i>=0;i--){const x=addDays(t,-i);d.push({l:+x.slice(8)+'',full:thDay(x),v:sumSales(x,x),hl:i===0})}
  else if(tab==='week'){let ws=addDays(weekStart(t),-77);for(let i=0;i<12;i++){d.push({l:thDate(ws).replace(/ \d+$/,''),full:'สัปดาห์ '+thDate(ws),v:sumSales(ws,addDays(ws,6)),hl:i===11});ws=addDays(ws,7)}}
  else {const x=new Date(t+'T00:00');x.setDate(1);x.setMonth(x.getMonth()-11);for(let i=0;i<12;i++){const m=ds(x).slice(0,7);d.push({l:x.toLocaleDateString('th-TH',{month:'short'}),full:thMonth(m),v:SL().filter(s=>s.date.startsWith(m)).reduce((a,s)=>a+saleTotal(s),0),hl:i===11});x.setMonth(x.getMonth()+1)}}
  barChart('sChart',d,{h:230});
};
function openSaleForm(date){ui.dsDate=date||today();ui.dsDraft=null;return go('dsum');const d=date||today();if(S.bills.some(b=>b.date===d&&!b.void))return modal(`<h2>${thDate(d)} มีบิลขายหน้าร้านแล้ว</h2><p style="margin-bottom:16px;line-height:1.7">ยอดขายวันนี้รวมจากบิลอัตโนมัติ — ถ้าจะเพิ่มยอด ให้ออกบิลที่หน้า “ขายหน้าร้าน”</p><div class="row end"><button class="btn" onclick="closeModal()">ปิด</button><button class="btn p" onclick="closeModal();ui.posDate='${d}';go('pos')">ไปหน้าขายหน้าร้าน</button></div>`);const s=S.sales.find(x=>x.date===d)||{};
  modal(`<h2>ลงยอดขายประจำวัน</h2><label class="f"><span>วันที่</span><input type="date" id="sDate" value="${d}" onchange="const x=S.sales.find(y=>y.date===this.value)||{};['cash','transfer','card','delivery','bills','note'].forEach(k=>document.getElementById('s_'+k).value=x[k]??'');sumUp()"></label>
  <div class="grid g2">${[['cash','เงินสด'],['transfer','โอน / QR'],['card','บัตรเครดิต'],['delivery','Delivery (Grab/LINE MAN)']].map(([k,n])=>`<label class="f"><span>${n}</span><input type="number" min="0" step="any" id="s_${k}" value="${s[k]??''}" oninput="sumUp()"></label>`).join('')}
  <label class="f"><span>จำนวนบิล</span><input type="number" min="0" id="s_bills" value="${s.bills??''}"></label><label class="f"><span>รวม</span><input id="sSum" disabled style="font-weight:600;background:var(--cream)"></label></div>
  <label class="f"><span>หมายเหตุ</span><input id="s_note" value="${esc(s.note||'')}" placeholder="เช่น ฝนตก, มีออเดอร์จัดเลี้ยง"></label>
  <div class="row end"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="sOk">บันทึก</button></div>`);sumUp();
  document.getElementById('sOk').onclick=()=>{const dd=val('sDate');const o={date:dd,cash:+val('s_cash')||0,transfer:+val('s_transfer')||0,card:+val('s_card')||0,delivery:+val('s_delivery')||0,bills:+val('s_bills')||0,note:val('s_note')};
    if(!saleTotal(o))return toast('กรอกยอดขายอย่างน้อย 1 ช่อง');
    const ex=S.sales.find(x=>x.date===dd);if(ex)Object.assign(ex,o);else S.sales.push({id:uid(),...o});save();closeModal();toast('บันทึกยอดขาย ฿'+money(saleTotal(o)));rerender()};
}
function sumUp(){const e=document.getElementById('sSum');if(e)e.value='฿'+money(['cash','transfer','card','delivery'].reduce((a,k)=>a+(+val('s_'+k)||0),0))}

function parseLink(s){const m=s.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/[?&](?:q|ll|query)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);

function saveGeo(){const g=G(),la=val('gLat'),ln=val('gLng');
  if((la&&!ln)||(!la&&ln)||(la&&(Math.abs(+la)>90||Math.abs(+ln)>180)))return toast('พิกัดไม่ถูกต้อง');
  g.lat=la?+la:null;g.lng=ln?+ln:null;g.radius=Math.max(20,+val('gRad')||100);g.maxAcc=Math.max(20,+val('gAcc')||150);g.policy=val('gPol');g.place=val('gPlace').trim()||'OHA ARTISAN BREAD';g.selfie=val('gSelf');g.sim=LIVE?'off':val('gSim');save();toast('บันทึกตำแหน่งร้านแล้ว');rerender()}
AFTER.staff=()=>{if(LIVE&&SERVER_V>=7&&isAdmin()&&!ui.aiStat)api('aiStatus').then(r=>{ui.aiStat=r;if(route==='staff'&&!modalOpen())rerender()}).catch(()=>{})};
function savePayroll(){const P={};document.querySelectorAll('.prT').forEach(s=>{const u=s.dataset.u,r=+document.querySelector(`.prR[data-u="${u}"]`).value||0,o=+document.querySelector(`.prO[data-u="${u}"]`).value||1.5;if(s.value&&r>0)P[u]={type:s.value,rate:r,otx:o}});S.payroll=P;save();toast('บันทึกค่าจ้างแล้ว')}
function saveSettings(){const st=S.settings;st.graceMin=Math.max(0,+val('stG')||0);const N=[...document.querySelectorAll('.tpN')],A=[...document.querySelectorAll('.tpS')],B=[...document.querySelectorAll('.tpE')],K=[...document.querySelectorAll('.tpB')];st.shiftTpl.forEach((t,i)=>{t.name=N[i].value.trim()||t.name;t.start=A[i].value||t.start;t.end=B[i].value||t.end;t.brk=Math.max(0,+K[i].value||0)});document.querySelectorAll('.q').forEach(q=>st.quota[q.dataset.k]=+q.value||0);save();toast('บันทึกการตั้งค่าแล้ว')}
let PINS={},ME_ADMIN=false;
const isAdmin=()=>!!ME&&(LIVE?ME_ADMIN:ME.id==='u0');
function pinCell(u){if(!isAdmin())return '••••';if(!ui.showPins)return '••••';const p=LIVE?PINS[u.id]:u.pin;return p?`<b style="letter-spacing:.15em">${esc(p)}</b>`:'<span style="color:var(--muted);font-size:12px">ไม่ทราบ (ให้รีเซ็ต)</span>'}
async function togglePins(){ui.showPins=!ui.showPins;if(ui.showPins&&LIVE){try{const r=await api('listPins');PINS={};Object.keys(r.pins).forEach(k=>{if(r.pins[k].pin)PINS[k]=r.pins[k].pin})}catch(e){ui.showPins=false;return toast(e.message)}}if(!ui.showPins)PINS={};rerender()}
function editUser(id){if(!id&&!isAdmin())return toast('เพิ่มผู้ใช้ได้เฉพาะอ๊อฟ');const u=id?S.users.find(x=>x.id===id):{name:'',pos:'',role:'staff',pin:''};
  modal(`<h2>${id?'แก้ไข':'เพิ่ม'}ผู้ใช้</h2><label class="f"><span>ชื่อเล่น</span><input id="uN" value="${esc(u.name)}"></label><label class="f"><span>ตำแหน่ง</span><input id="uP" value="${esc(u.pos)}" placeholder="เช่น เบเกอร์, หน้าร้าน"></label>
  <div class="grid g2"><label class="f"><span>สิทธิ์</span><select id="uR"><option value="staff" ${u.role==='staff'?'selected':''}>พนักงาน</option><option value="owner" ${u.role==='owner'?'selected':''}>เจ้าของ / ผู้จัดการ</option></select></label>
  ${isAdmin()?`<label class="f"><span>${id?'PIN (แก้เพื่อรีเซ็ต)':'PIN (4–6 หลัก)'}</span><input id="uPin" inputmode="numeric" maxlength="6" value="${esc(id?(LIVE?(PINS[id]||''):(u.pin||'')):'')}" placeholder="${id&&LIVE&&!PINS[id]?'ไม่ทราบ PIN — ใส่เพื่อรีเซ็ต':''}"></label>`:'<div class="hint" style="align-self:end;margin-bottom:12px">PIN ตั้งได้เฉพาะอ๊อฟ</div>'}</div>
  <div id="uStaffBox" style="${u.role==='staff'?'':'display:none'}"><div class="grid g2"><label class="f"><span>ประเภทพนักงาน</span><select id="uE"><option value="full" ${u.empType!=='extra'?'selected':''}>ประจำ</option><option value="extra" ${u.empType==='extra'?'selected':''}>Extra / Part-time</option></select></label>
   <label class="f"><span>กะปกติ</span><select id="uS">${(S.settings.shiftTpl||[]).map(t=>`<option value="${t.id}" ${(u.defShift||'M')===t.id?'selected':''}>${esc(t.name)} ${t.start}–${t.end}</option>`).join('')}</select></label></div>
   <label class="f"><span>วันทำงานปกติ</span></label><div class="row mb" style="gap:6px">${DOWS.map((d,i)=>`<label class="pill neu" style="cursor:pointer;padding:5px 10px"><input type="checkbox" class="uWD" value="${i}" ${(u.workDays||[1,2,3,4,5,6]).includes(i)?'checked':''} style="width:auto;margin-right:4px">${d}</label>`).join('')}</div></div>
  <div class="row end">${id&&id!==ME.id?'<button class="btn g danger" id="uDel">ลบ</button><span class="sp"></span>':''}<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="uOk">บันทึก</button></div>`);
  document.getElementById('uR').onchange=e=>document.getElementById('uStaffBox').style.display=e.target.value==='staff'?'':'none';
  document.getElementById('uOk').onclick=async()=>{const pe=document.getElementById('uPin'),p0=pe?pe.value.trim():'';if(!val('uN').trim())return toast('ระบุชื่อ');
    const orig=id?(LIVE?(PINS[id]||''):(u.pin||'')):'',p=(isAdmin()&&p0&&p0!==orig)?p0:'';
    if(isAdmin()&&(!id||p0)&&!/^\d{4,6}$/.test(p0))return toast('PIN ต้องเป็นตัวเลข 4–6 หลัก');
    if(id===ME.id&&val('uR')!=='owner'&&S.users.filter(x=>x.role==='owner').length<2)return toast('ต้องมีเจ้าของร้านอย่างน้อย 1 คน');
    const o={name:val('uN').trim(),pos:val('uP').trim(),role:val('uR')};if(o.role==='staff'){o.empType=val('uE');o.defShift=val('uS');o.workDays=[...document.querySelectorAll('.uWD:checked')].map(x=>+x.value)}if(!LIVE&&p)o.pin=p;
    let uidv=id;if(id)Object.assign(u,o);else{uidv=uid();S.users.push({id:uidv,...o})}
    save();closeModal();rerender();
    if(LIVE&&p){try{await flush();await api('setPin',{uid:uidv,pin:p});PINS[uidv]=p;rerender();toast('บันทึกแล้ว — ตั้ง PIN ใหม่เรียบร้อย')}catch(e){toast('บันทึกข้อมูลแล้ว แต่ตั้ง PIN ไม่สำเร็จ: '+e.message)}}else toast('บันทึกแล้ว')};
  if(id&&id!==ME.id)document.getElementById('uDel').onclick=()=>confirmBox('ลบผู้ใช้ “'+esc(u.name)+'”? (ประวัติเดิมยังอยู่)',()=>{S.users=S.users.filter(x=>x.id!==id);save();rerender()});
}
function copyBackup(){const txt=JSON.stringify(S);if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('คัดลอกแล้ว — วางเก็บใน Notes / LINE / Drive'),()=>showBackup(txt));else showBackup(txt)}
function showBackup(txt){modal(`<h2>ข้อมูลสำรอง</h2><textarea rows="10" readonly onclick="this.select()">${esc(txt)}</textarea><div class="row end" style="margin-top:12px"><button class="btn" onclick="closeModal()">ปิด</button></div>`)}
function restoreBackup(){modal(`<h2>กู้คืนข้อมูล</h2><label class="f"><span>วางข้อมูล JSON ที่คัดลอกไว้</span><textarea id="rb" rows="8"></textarea></label><div class="row end"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="rbOk">กู้คืน</button></div>`);
  document.getElementById('rbOk').onclick=()=>{try{const d=JSON.parse(val('rb'));if(!d.users||!d.items)throw 0;S=migrate(d);save();ME=S.users.find(u=>u.id===ME.id)||S.users.find(u=>u.role==='owner');closeModal();toast('กู้คืนแล้ว');rerender()}catch(e){toast('ข้อมูลไม่ถูกต้อง')}}}

function syncProducts(){S.products=GA().map(g=>g.name)}
function pendingWhs(date,gid){return S.worders.filter(o=>o.deliverDate===date&&(o.status==='pending'||o.status==='prepared')).reduce((a,o)=>a+o.items.filter(i=>i.gid===gid).reduce((s,i)=>s+ +i.qty,0),0)}
function sheet(date,all){const rows={};S.goods.forEach(g=>rows[g.id]={g,carry:0,prod:0,add:0,recv:0,sale:0,whs:0,promo:0,waste:0});
  S.pmoves.forEach(m=>{if(m.date===date&&rows[m.gid])rows[m.gid][m.type]+= +m.qty});
  return S.goods.filter(g=>all||g.active!==false).map(g=>{const r=rows[g.id];r.avail=r.carry+r.prod+r.add+r.recv;r.out=r.sale+r.whs+r.promo+r.waste;r.left=r.avail-r.out;r.pend=pendingWhs(date,g.id);return r})}
function pmove(date,gid,type,qty,note,ref){S.pmoves.push({id:uid(),date,gid,type,qty:+qty,note:note||'',uid:ME?ME.id:'',at:new Date().toISOString(),ref:ref||''})}

function seedProd(){
  const t=today();
  const goods=defaultGoods();
  const pop=[1.05,0.7,0.85,0.9,0.95,1.1,0.75,1.0,1.25];
  const gi=n=>goods.find(g=>g.name===n).id;
  const wcust=[
    {name:'Morning Roast Café',type:'คาเฟ่',contact:'คุณมายด์',phone:'0812345601',address:'ถ.ถลาง ตัวเมือง',terms:15,discount:20,days:[1,4],items:[['Croissant',20],['Cinnamon Roll',10]]},
    {name:'Sea Breeze Boutique Hotel',type:'โรงแรม',contact:'คุณแนน (จัดซื้อ)',phone:'0812345602',address:'หาดกะตะ',terms:30,discount:25,days:[1,3,5],items:[['Country Sourdough',6],['Multigrain Sourdough',4],['Croissant',24]]},
    {name:'ร้านกาแฟบ้านสวน',type:'ร้านกาแฟ',contact:'ป้าแดง',phone:'0812345603',address:'ซอยสามกอง',terms:0,discount:15,days:[6],items:[['Croissant',12],['Beef Pie',4]]},
    {name:'Little Kitchen Co-working',type:'Co-working',contact:'คุณโจ',phone:'0812345604',address:'ถ.ภูเก็ต',terms:7,discount:20,days:[2,5],items:[['Massaman Chicken Pie',6],['Black Olive Sourdough',3]]}
  ].map(c=>({id:uid(),name:c.name,type:c.type,contact:c.contact,phone:c.phone,address:c.address,line:'',terms:c.terms,discount:c.discount,days:c.days,note:'',active:true,since:addDays(t,-60),_items:c.items}));
  const worders=[];let seq=0;
  for(let i=-35;i<=6;i++){const d=addDays(t,i),dow=new Date(d+'T00:00').getDay();
    wcust.forEach(c=>{if(!c.days.includes(dow))return;seq++;
      const items=c._items.map(([n,q])=>{const g=goods.find(x=>x.name===n);return {gid:g.id,qty:Math.max(1,q+Math.round((Math.random()-.5)*4)),price:Math.round(g.price*(1-c.discount/100))}});
      let status=i<0?'delivered':'pending';if(i===0&&c.terms===30)status='prepared';if(i===-1&&c.name.startsWith('Little'))status='pending';
      const o={id:uid(),no:'WO'+d.slice(2).replace(/-/g,'')+'-'+String(seq%100).padStart(2,'0'),custId:c.id,orderDate:addDays(d,-2),deliverDate:d,items,status,note:'',paid:false,by:'u0',at:new Date(addDays(d,-2)+'T10:00:00').toISOString()};
      if(status==='delivered'){o.deliveredAt=new Date(d+'T09:30:00').toISOString();o.paid=daysBetween(d,t)-1>c.terms+2||(c.terms===0)||Math.random()<.35;if(o.paid)o.paidAt=o.deliveredAt}
      worders.push(o)})}
  wcust.forEach(c=>delete c._items);
  const pmoves=[], dayClosed={}, carryNext={};
  const mv=(date,gid,type,qty,note,ref)=>{if(qty>0)pmoves.push({id:uid(),date,gid,type,qty,note:note||'',uid:'u1',at:new Date(date+'T08:00:00').toISOString(),ref:ref||''})};
  for(let i=-35;i<=0;i++){const d=addDays(t,i),wd=new Date(d+'T00:00').getDay(),wf=(wd===0||wd===6)?1.35:1;const counts={};
    goods.forEach((g,k)=>{
      const dOrders=worders.filter(o=>o.deliverDate===d&&o.status!=='cancelled');
      const whs=dOrders.reduce((a,o)=>a+o.items.filter(x=>x.gid===g.id).reduce((s,x)=>s+x.qty,0),0);
      const delivered=dOrders.filter(o=>o.status==='delivered');
      const demand=Math.round(g.par*pop[k]*wf*(0.8+Math.random()*0.4));
      const carry=carryNext[g.id]||0; const prod=g.par+whs;
      const add=(demand>g.par*0.95&&Math.random()<.6)?Math.round(g.par*0.3):0;
      const avail=carry+prod+add;
      if(i===0){mv(d,g.id,'carry',carry,'ยกมาจากเมื่อวาน','close:'+addDays(d,-1));mv(d,g.id,'prod',prod,'');
        mv(d,g.id,'sale',Math.min(Math.round(demand*.45),avail-whs),'');if(k===8)mv(d,g.id,'promo',2,'แจกชิมหน้าร้าน');return}
      delivered.forEach(o=>o.items.filter(x=>x.gid===g.id).forEach(x=>mv(d,g.id,'whs',x.qty,o.no,'wo:'+o.id)));
      const sale=Math.max(0,Math.min(demand,avail-whs));
      let promo=Math.min(Math.max(0,avail-whs-sale),Math.random()<.5?Math.floor(Math.random()*(k===8?5:3)):0);
      const waste=Math.min(Math.max(0,avail-whs-sale-promo),Math.random()<.2?1:0);
      const left=avail-whs-sale-promo-waste;
      mv(d,g.id,'carry',carry,'ยกมาจากเมื่อวาน','close:'+addDays(d,-1));mv(d,g.id,'prod',prod,'');mv(d,g.id,'add',add,'');
      mv(d,g.id,'promo',promo,['แจกชิมหน้าร้าน','ถ่ายรูป/ทำคอนเทนต์','ของแถมลูกค้า'][Math.floor(Math.random()*3)]);mv(d,g.id,'waste',waste,'เสียระหว่างวัน');
      mv(d,g.id,'sale',sale,'ขายตามการนับปิดร้าน','close:'+d);
      counts[g.id]=left;
      const old=Math.min(left,Math.max(0,carry-sale)); // ของยกมาที่ขายไม่หมด (ขายเก่าก่อน) — ยกได้แค่ 1 วัน
      if(g.carry){carryNext[g.id]=left-old;counts[g.id]=left-old;mv(d,g.id,'waste',old,'ของยกมาเกิน 1 วัน','close:'+d)}else{carryNext[g.id]=0;mv(d,g.id,'waste',left,'ทิ้งสิ้นวัน','close:'+d)}
    });
    if(i<0)dayClosed[d]={by:'u1',at:new Date(d+'T18:30:00').toISOString(),counts};
  }
  return {goods,pmoves,dayClosed,wcust,worders};
}

/* ---------- planning & analysis ---------- */
function planFor(date){
  const prevDays=[...Array(28)].map((_,i)=>addDays(date,-(i+1)));
  const sheets={};prevDays.forEach(d=>sheets[d]=sheet(d,true));
  const dow=new Date(date+'T00:00').getDay();
  const yd=addDays(date,-1), ydClosed=S.dayClosed[yd];
  return GA().map(g=>{
    const rowOf=d=>sheets[d].find(r=>r.g.id===g.id);
    let same=prevDays.filter(d=>new Date(d+'T00:00').getDay()===dow&&S.dayClosed[d]).map(d=>rowOf(d).sale);
    if(!same.length)same=prevDays.slice(0,7).filter(d=>S.dayClosed[d]).map(d=>rowOf(d).sale);
    const avg=same.length?same.reduce((a,b)=>a+b,0)/same.length:g.par;
    const last14=prevDays.slice(0,14).filter(d=>S.dayClosed[d]&&rowOf(d).avail>0);
    const soldOut=last14.filter(d=>(S.dayClosed[d].counts||{})[g.id]===0).length;
    const wasteQ=last14.reduce((a,d)=>a+rowOf(d).waste,0), availQ=last14.reduce((a,d)=>a+rowOf(d).prod+rowOf(d).add,0);
    const soRate=last14.length?soldOut/last14.length:0, wRate=availQ?wasteQ/availQ:0;
    let f=1,why=[];
    if(soRate>=0.4){f*=1.15;why.push(`<span class="pill good">ขายหมด ${soldOut}/${last14.length} วัน ↑15%</span>`)}
    if(wRate>0.12){f*=0.9;why.push(`<span class="pill bad">ทิ้ง ${(wRate*100).toFixed(0)}% ↓10%</span>`)}
    const front=Math.ceil(avg*f), whs=pendingWhs(date,g.id);
    const carry=g.carry&&ydClosed?((ydClosed.counts||{})[g.id]||0):0;
    return {g,avg,front,whs,carry,sug:Math.max(0,front+whs-carry),why,soRate,wRate};
  });
}
function analyze(n){const t=today(),days=[...Array(n)].map((_,i)=>addDays(t,-(i+1))).filter(d=>S.dayClosed[d]);
  const acc={};GA().forEach(g=>acc[g.id]={g,sale:0,whs:0,promo:0,waste:0,avail:0,prod:0,add:0,soldOut:0,days:0});
  days.forEach(d=>sheet(d).forEach(r=>{const a=acc[r.g.id];if(!a)return;['sale','whs','promo','waste','avail','prod','add'].forEach(k=>a[k]+=r[k]);
    if(r.avail>0){a.days++;if((S.dayClosed[d].counts||{})[r.g.id]===0)a.soldOut++}}));
  const list=Object.values(acc).map(a=>({...a,sold:a.sale+a.whs,st:(a.prod+a.add)?Math.min(1,(a.sale+a.whs)/(a.prod+a.add)):0,wr:(a.prod+a.add)?a.waste/(a.prod+a.add):0,rev:a.sale*a.g.price,promoV:a.promo*a.g.price})).sort((a,b)=>b.sold-a.sold);
  return {days:days.length,list};
}

const WST={pending:['รอเตรียม','warn'],prepared:['เตรียมแล้ว','terra'],delivered:['ส่งแล้ว','good'],cancelled:['ยกเลิก','neu']};
const WC=id=>S.wcust.find(c=>c.id===id)||{name:'(ลบแล้ว)',terms:0,discount:0};
const oTotal=o=>o.items.reduce((a,i)=>a+i.qty*i.price,0);
const oQty=o=>o.items.reduce((a,i)=>a+ +i.qty,0);

const termTxt=t=>t?'เครดิต '+t+' วัน':'เงินสด';
function dueOf(o){return o.deliveredAt?addDays(o.deliveredAt.slice(0,10),WC(o.custId).terms):null}
function payPill(o){if(o.status!=='delivered')return '';if(o.paid)return '<span class="pill good">ชำระแล้ว</span>';const due=dueOf(o);
  return due<today()?`<span class="pill bad">เกินกำหนด ${daysBetween(due,today())-1} วัน</span>`:`<span class="pill warn">ค้างชำระ · ครบ ${thDate(due)}</span>`}
const stPill=o=>`<span class="pill ${WST[o.status][1]}">${WST[o.status][0]}</span>`;
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
function custStats(c){const os=S.worders.filter(o=>o.custId===c.id&&o.status!=='cancelled');const del=os.filter(o=>o.status==='delivered');
  const unpaid=del.filter(o=>!o.paid);return {n:os.length,value:del.reduce((a,o)=>a+oTotal(o),0),unpaid:unpaid.reduce((a,o)=>a+oTotal(o),0),overdue:unpaid.filter(o=>dueOf(o)<today()).reduce((a,o)=>a+oTotal(o),0),
    last:os.map(o=>o.deliverDate).filter(d=>d<=today()).sort().pop(),next:os.filter(o=>o.status==='pending'||o.status==='prepared').map(o=>o.deliverDate).sort()[0]}}

function wSchedule(){const t=today(),tm=addDays(t,1),open=S.worders.filter(o=>o.status==='pending'||o.status==='prepared').sort((a,b)=>a.deliverDate.localeCompare(b.deliverDate));
  const late=open.filter(o=>o.deliverDate<t),td=open.filter(o=>o.deliverDate===t),tmr=open.filter(o=>o.deliverDate===tm),wk=open.filter(o=>o.deliverDate>tm&&o.deliverDate<=addDays(t,7));

function dsDraftFor(d){if(ui.dsDraft&&ui.dsDraft.date===d)return ui.dsDraft;const s=S.sales.find(x=>x.date===d)||{};
