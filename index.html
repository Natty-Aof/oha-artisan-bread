function dsSet(k,gid,v){const D=ui.dsDraft;D[k][gid]=v===''?'':+v;D.dirty=1;dsTot()}
function dsTot(){const D=ui.dsDraft;D.dirty=1;const it=dsItemsTotal(D),pt=dsPayTotal(D);const a=document.getElementById('dsIT');if(a)a.textContent='฿'+money(it);const c=document.getElementById('dsChk');if(c)c.innerHTML=dsChk(it,pt)}
function dsChk(it,pt){if(!pt)return `<div class="note">ยังไม่ได้แยกช่องทาง — ยอด ฿${money(it)} จะนับเป็น “ไม่ระบุช่องทาง”</div>`;const df=it-pt;
  return Math.abs(df)<1?`<div class="note" style="background:var(--good-l)">✓ ยอดรายสินค้าตรงกับยอดตามช่องทาง ฿${money(pt)}</div>`:`<div class="note" style="background:var(--warn-l)">⚠ ยอดรายสินค้า ฿${money(it)} ${df>0?'มากกว่า':'น้อยกว่า'}ยอดตามช่องทาง ฿${money(pt)} อยู่ ฿${money(Math.abs(df))} — ตรวจอีกครั้ง (บันทึกได้)</div>`}
function saveDsum(d){const D=ui.dsDraft;if(!D||D.date!==d)return;
  const items=GA().filter(g=>+D.qty[g.id]>0||+D.amt[g.id]>0).map(g=>({gid:g.id,name:g.name,qty:+D.qty[g.id]||0,amount:D.amt[g.id]!==''&&D.amt[g.id]!=null?+D.amt[g.id]:(+D.qty[g.id]||0)*g.price}))
    .concat(D.others.filter(o=>o.name&&(+o.qty||+o.amount)).map(o=>({gid:null,name:o.name,qty:+o.qty||0,amount:+o.amount||0})));
  const it=items.reduce((a,i)=>a+i.amount,0),pay={};PAYF.forEach(([k])=>pay[k]=+D.pay[k]||0);const pt=dsPayTotal(D);
  if(!it&&!pt)return toast('กรอกยอดขายอย่างน้อย 1 รายการ');

const KW={name:['สินค้า','รายการ','ชื่อ','เมนู','item','product','name','menu','description'],qty:['จำนวน','qty','quantity','ชิ้น','หน่วย','count','sold'],amt:['ยอดขายสุทธิ','สุทธิ','ยอดเงิน','ยอดขาย','ยอดรวม','รวม','amount','total','net','sales','ราคารวม'],date:['วันที่','date','วัน']};
const normN=s=>String(s||'').toLowerCase().replace(/[\s\-_().]/g,'');
function importPOS(){modal(`<h2>📥 นำเข้าไฟล์จากเครื่อง POS</h2><p style="font-size:14px;color:var(--ink2);margin-bottom:12px;line-height:1.7">Export รายงาน <b>“ยอดขายตามสินค้า”</b> จากเครื่อง POS เป็นไฟล์ Excel (.xlsx) หรือ CSV แล้วเลือกไฟล์ที่นี่ ระบบจะจับคู่ชื่อสินค้าให้ และจำการจับคู่ไว้ใช้ครั้งหน้า</p>
  <label class="btn p" style="cursor:pointer;width:100%;padding:14px">เลือกไฟล์ (.xlsx / .xls / .csv)<input type="file" accept=".xlsx,.xls,.csv,text/csv" style="display:none" onchange="readPOS(this.files[0])"></label>
  <div class="row end" style="margin-top:14px"><button class="btn" onclick="closeModal()">ยกเลิก</button></div>`,560)}
async function readPOS(file){if(!file)return;try{await loadXLSX();const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
  if(!rows.length)return toast('ไฟล์ว่าง');
  let hr=0,best=-1;rows.slice(0,15).forEach((r,i)=>{const sc=r.reduce((a,c)=>a+(Object.values(KW).some(k=>k.some(w=>normN(c).includes(normN(w))))?1:0),0);if(sc>best){best=sc;hr=i}});
  const head=rows[hr].map((c,i)=>String(c).trim()||('คอลัมน์ '+(i+1)));const body=rows.slice(hr+1);
  const pick=k=>{for(const w of KW[k]){const i=head.findIndex(h=>normN(h).includes(normN(w)));if(i>=0)return i}return -1};
  window._pos={file:file.name,head,body,map:{name:pick('name'),qty:pick('qty'),amt:pick('amt'),date:pick('date')}};
  if(_pos.map.name<0)_pos.map.name=0;posMapUI()}catch(e){toast('อ่านไฟล์ไม่ได้: '+e.message)}}
function parseDate(v){if(v instanceof Date)return ds(v);if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return ds(new Date(d.getTime()+d.getTimezoneOffset()*6e4))}
  const s=String(v).trim();let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);if(m){let y=+m[1];if(y>2400)y-=543;return y+'-'+pad(+m[2])+'-'+pad(+m[3])}
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=y>60?2500-543:2000;if(y>2400)y-=543;return y+'-'+pad(+m[2])+'-'+pad(+m[1])}return ''}
const toNum=v=>typeof v==='number'?v:(+String(v).replace(/[^\d.\-]/g,'')||0);
function posAgg(){const P=_pos,m=P.map,d=P.date;const g={};
  P.body.forEach(r=>{const n=String(r[m.name]||'').trim();if(!n)return;if(/^(รวม|ยอดรวม|total|grand|sum|subtotal)/i.test(n))return;
    if(m.date>=0&&d){const rd=parseDate(r[m.date]);if(rd&&rd!==d)return}
    const k=normN(n);g[k]=g[k]||{name:n,qty:0,amount:0};g[k].qty+=m.qty>=0?toNum(r[m.qty]):0;g[k].amount+=m.amt>=0?toNum(r[m.amt]):0});return Object.values(g)}
function autoMatch(n){const al=S.posAlias||{},k=normN(n);if(al[k])return al[k];const gs=GA();
  let g=gs.find(x=>normN(x.name)===k)||gs.find(x=>k.includes(normN(x.name)))||gs.find(x=>normN(x.name).includes(k)&&k.length>=4);return g?g.id:''}
function posMapUI(){const P=_pos;if(!P.date){const ds0=P.map.date>=0?[...new Set(P.body.map(r=>parseDate(r[P.map.date])).filter(Boolean))].sort():[];P.dates=ds0;P.date=ds0.includes(ui.dsDate||today())?(ui.dsDate||today()):(ds0.length===1?ds0[0]:(ui.dsDate||today()))}
  const L=posAgg();P.rows=L.map(x=>({...x,gid:x.gid!==undefined?x.gid:autoMatch(x.name)}));
  const opt=(i,c)=>`<select onchange="_pos.map.${c}=+this.value;posMapUI()" style="width:auto"><option value="-1">— ไม่มี —</option>${P.head.map((h,j)=>`<option value="${j}" ${i===j?'selected':''}>${esc(h)}</option>`).join('')}</select>`;
  modal(`<h2>📥 ${esc(P.file)}</h2>
  <div class="grid g2" style="gap:8px;margin-bottom:10px"><label class="f" style="margin:0"><span>คอลัมน์ชื่อสินค้า</span>${opt(P.map.name,'name')}</label><label class="f" style="margin:0"><span>คอลัมน์จำนวน</span>${opt(P.map.qty,'qty')}</label><label class="f" style="margin:0"><span>คอลัมน์ยอดเงิน</span>${opt(P.map.amt,'amt')}</label><label class="f" style="margin:0"><span>คอลัมน์วันที่</span>${opt(P.map.date,'date')}</label></div>
  <label class="f"><span>นำเข้าเป็นยอดของวันที่</span>${P.dates&&P.dates.length>1?`<select onchange="_pos.date=this.value;posMapUI()">${P.dates.map(x=>`<option value="${x}" ${x===P.date?'selected':''}>${thDate(x)}</option>`).join('')}</select>`:`<input type="date" value="${P.date}" onchange="_pos.date=this.value;posMapUI()" ${isOwner()?'':'disabled'}>`}</label>
  <div style="max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px"><table><tr><th>ชื่อในไฟล์ POS</th><th class="n">จำนวน</th><th class="n">ยอดเงิน</th><th>จับคู่กับ</th></tr>
  ${P.rows.map((r,i)=>`<tr><td>${esc(r.name)}</td><td class="n">${num(r.qty)}</td><td class="n">${money(r.amount)}</td><td><select onchange="_pos.rows[${i}].gid=this.value" style="min-width:150px;${r.gid?'':'border-color:var(--warn)'}"><option value="">รายการอื่น (ไม่ใช่ขนมในเมนู)</option><option value="-" ${r.gid==='-'?'selected':''}>ข้าม (ไม่นำเข้า)</option>${GA().map(g=>`<option value="${g.id}" ${r.gid===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="4" class="empty">ไม่พบรายการ — ลองเลือกคอลัมน์หรือวันที่ใหม่</td></tr>'}</table></div>
  <div class="hint">รวม ${P.rows.length} รายการ · ${num(P.rows.reduce((a,r)=>a+r.qty,0))} ชิ้น · ฿${money(P.rows.reduce((a,r)=>a+r.amount,0))}</div>
  <div class="row end" style="margin-top:12px"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" onclick="applyPOS()" ${P.rows.length?'':'disabled'}>นำเข้าไปที่ฟอร์มสรุปยอด</button></div>`,720)}
function applyPOS(){const P=_pos,d=P.date;if(!isOwner()&&d!==today())return toast('พนักงานนำเข้าได้เฉพาะยอดของวันนี้');

/* กะของคนนี้ในวันนี้: ตารางที่จัดไว้ → ค่าเริ่มต้นของคน → null = วันหยุด */
function shiftOf(uid,date){const r=S.shifts.find(x=>x.uid===uid&&x.date===date);
  if(r){if(r.tpl==='OFF')return null;const t=tplOf(r.tpl)||{};return {tpl:r.tpl,name:r.tpl==='C'?'กะพิเศษ':t.name,start:r.start||t.start,end:r.end||t.end,brk:r.brk??t.brk??S.settings.breakHours,color:t.color||'#5C6055',note:r.note,custom:true}}

};

function setShift(uid,d,tpl,silent){const id=d+'_'+uid;let r=S.shifts.find(x=>x.id===id);if(!r){r={id,date:d,uid};S.shifts.push(r)}

/* ================= PROFIT & LOSS (กำไร-ขาดทุน) ================= */
const COGS_CATS=['วัตถุดิบ','บรรจุภัณฑ์','สินค้าซื้อมาขาย'];
const PR=()=>S.payroll||{};
function laborOf(mo){const pr=PR();let base=0,ot=0,det=[];
  S.users.forEach(u=>{const p=pr[u.id];if(!p||!(+p.rate))return;const att=S.attendance.filter(a=>a.uid===u.id&&a.date.startsWith(mo));
    const hrs=att.reduce((s,a)=>s+netHours(a),0),hourly=p.type==='monthly'?p.rate/30/8:p.type==='daily'?p.rate/8:+p.rate;
    const b=p.type==='monthly'?+p.rate:p.type==='daily'?att.length*p.rate:hrs*p.rate;
    const oh=S.ot.filter(o=>o.uid===u.id&&o.status==='approved'&&o.date.startsWith(mo)).reduce((s,o)=>s+ +o.hours,0),o=oh*hourly*(+p.otx||1.5);
    if((p.type==='monthly'||p.type==='daily')&&!att.length)return;/* เดือนที่ไม่มีการลงเวลา ไม่คิด */base+=b;ot+=o;det.push({u,b,o,hrs})});
  return {base,ot,total:base+ot,det}}
function pnlMonth(mo){const sales=SL().filter(s=>s.date.startsWith(mo)).reduce((a,s)=>a+saleTotal(s),0);
  const whs=S.worders.filter(o=>o.status==='delivered'&&(o.deliveredAt||o.deliverDate).slice(0,7)===mo).reduce((a,o)=>a+oTotal(o),0);
  const ex={};S.expenses.filter(e=>e.date.startsWith(mo)).forEach(e=>ex[e.cat]=(ex[e.cat]||0)+ +e.amount);
  const lab=laborOf(mo),usePay=Object.keys(PR()).some(k=>+(PR()[k]||{}).rate>0);
  const cogs=COGS_CATS.reduce((a,c)=>a+(ex[c]||0),0);
  const opex={};Object.keys(ex).forEach(c=>{if(COGS_CATS.includes(c))return;if(usePay&&c==='ค่าแรง / OT')return;opex[c]=ex[c]});
  const labor=usePay?lab.total:0,opT=Object.values(opex).reduce((a,b)=>a+b,0);
  const rev=sales+whs,gross=rev-cogs,net=gross-labor-opT;
  return {mo,sales,whs,rev,cogs,gross,labor,lab,opex,opT,net,usePay,exLabor:ex['ค่าแรง / OT']||0}}
VIEWS.pnl=()=>{const y=+(ui.pnlY||today().slice(0,4)),cur=today().slice(0,7),months=[...Array(12)].map((_,i)=>y+'-'+pad(i+1)).filter(m=>m<=cur);

function ufac(ru,iu){if(ru===iu)return 1;const m={'g>kg':.001,'kg>g':1000,'ml>ลิตร':.001,'ลิตร>ml':1000,'g>ลิตร':.001,'ml>kg':.001};return m[ru+'>'+iu]??null}
const RIT=id=>S.items.find(i=>i.id===id);
/* วัตถุดิบที่ใช้ต่อ 1 รอบสูตร → ต่อชิ้น (หน่วยของสต็อก) */
function recipeUse(g,pcs){const r=g.recipe;if(!r||!(+r.yield>0))return [];
  return (r.rows||[]).map(x=>{const it=x.itemId?RIT(x.itemId):null,f=it?ufac(x.unit,it.unit):null;
    return {row:x,it,name:it?it.name:x.name,qty:x.qty/r.yield*pcs,unit:x.unit,stockQty:it&&f!=null?x.qty*f/r.yield*pcs:null,stockUnit:it?it.unit:'',cost:it&&f!=null?x.qty*f/r.yield*pcs*(+it.cost||0):0,bad:it&&f==null}})}
const costPer=g=>isBuy(g)?(+g.cost||0):recipeUse(g,1).reduce((a,x)=>a+x.cost,0);
const fmtQ=(q,u)=>(u==='g'||u==='ml')&&q>=1000?num(q/1000,2)+(u==='g'?' kg':' ลิตร'):num(q,q<10?1:0)+' '+u;
function usageForDay(date){const m={};sheet(date,true).forEach(r=>{const pcs=r.prod+r.add;if(pcs>0)recipeUse(r.g,pcs).forEach(x=>{if(x.it&&x.stockQty!=null)m[x.it.id]=(m[x.it.id]||0)+x.stockQty})});return m}

  S.moves.filter(m=>m.ref===ref).forEach(m=>{const it=RIT(m.itemId);if(it)it.qty=Math.round((it.qty+ +m.qty)*1000)/1000});S.moves=S.moves.filter(m=>m.ref!==ref);
  const u=usageForDay(date);Object.keys(u).forEach(id=>{const it=RIT(id),q=Math.round(u[id]*1000)/1000;if(!it||!q)return;it.qty=Math.round((it.qty-q)*1000)/1000;
    S.moves.push({id:uid(),itemId:id,type:'out',qty:q,note:'ตัดอัตโนมัติจากการผลิต '+thDate(date),uid:ME?ME.id:'',at:new Date().toISOString(),ref})})}

  g.recipe={yield:12,lead:1,rows:[{itemId:ids[0],name:'',qty:421,unit:'g'},{itemId:ids[1],name:'',qty:226,unit:'g'},{itemId:'',name:'น้ำ',qty:324,unit:'g'},{itemId:ids[2],name:'',qty:129,unit:'g'}],

  modal(`<h2>📦 รับสินค้ามาขาย</h2><p class="hint" style="margin:-8px 0 12px">สินค้าที่ซื้อ/รับจากร้านอื่นมาขายต่อ (ไม่ได้ผลิตเอง) — ยอดจะเข้าช่อง “รับมา” ในตารางรายวัน</p>

  <div class="grid g2" id="rvEbox"><label class="f"><span>ใครจ่าย</span><select id="rvP">${S.users.map(u=>`<option value="${u.id}" ${u.id===ME.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></label><label class="f"><span>จ่ายด้วย</span><select id="rvS">${Object.entries(PAY_SRC).map(([k,[n]])=>`<option value="${k}" ${k==='shop_bank'?'selected':''}>${n}</option>`).join('')}<option value="credit">ยังไม่จ่าย (ค้างจ่ายร้านค้า)</option></select></label></div>`:''}
  <div class="row end"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="rvOk">บันทึกการรับสินค้า</button></div>`,600);
  rvRows();
  document.getElementById('rvOk').onclick=()=>{const dd=val('rvD'),from=val('rvF').trim(),L=_rv.filter(x=>x.gid&&+x.qty>0);if(!L.length)return toast('ใส่สินค้าและจำนวน');
    let tot=0;L.forEach(x=>{const g=GG(x.gid),c=+x.cost||0;pmove(dd,x.gid,'recv',+x.qty,(from?'จาก '+from:'รับมาขาย')+(c?' · ทุน '+money(c):''));S.pmoves[S.pmoves.length-1].from=from;S.pmoves[S.pmoves.length-1].cost=c;
      if(c&&g.cost!==c){g.cost=c}tot+=c*(+x.qty)});
    const e=document.getElementById('rvE');if(e&&e.checked&&tot>0){const src=val('rvS');S.expenses.push({id:uid(),date:dd,desc:'รับสินค้ามาขาย'+(from?' จาก '+from:'')+': '+L.map(x=>GG(x.gid).name+' ×'+x.qty).join(', '),cat:'สินค้าซื้อมาขาย',amount:tot,payer:val('rvP'),src:src==='credit'?'shop_bank':src,note:src==='credit'?'ยังไม่จ่าย — ค้างจ่ายร้านค้า':'',by:ME.id,at:new Date().toISOString(),reimbursed:false})}
    save();closeModal();toast('รับสินค้า '+L.reduce((a,x)=>a+ +x.qty,0)+' ชิ้น'+(tot?' · ทุนรวม ฿'+money(tot):''));ui.pdate=dd;rerender()}}

  el.innerHTML=_rv.map((x,i)=>`<div class="grid" style="grid-template-columns:1fr 80px 100px 30px;gap:6px;margin-bottom:6px"><select onchange="_rv[${i}].gid=this.value;_rv[${i}].cost=GG(this.value).cost||'';rvRows()"><option value="">— เลือกสินค้า —</option>${gs.map(g=>`<option value="${g.id}" ${g.id===x.gid?'selected':''}>${esc(g.name)}${isBuy(g)?' (ซื้อมาขาย)':''}</option>`).join('')}</select>
   <input type="number" min="0" value="${x.qty}" oninput="_rv[${i}].qty=this.value;rvTot()" style="text-align:right"><input type="number" min="0" step="any" value="${x.cost}" placeholder="บาท" oninput="_rv[${i}].cost=this.value;rvTot()" style="text-align:right"><button class="btn sm g" onclick="_rv.splice(${i},1);rvRows()">✕</button></div>`).join('');rvTot()}
function rvTot(){const t=_rv.reduce((a,x)=>a+(+x.qty||0)*(+x.cost||0),0),e=document.getElementById('rvT');if(e)e.textContent=t?'ทุนรวม ฿'+money(t):''}
function newBuyGood(){const box=document.getElementById('rvNew');box.innerHTML=`<div class="note mb"><div style="font-weight:500;margin-bottom:6px">สินค้าใหม่ (ซื้อมาขาย)</div><div class="grid" style="grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px"><input id="nbN" placeholder="ชื่อสินค้า"><input id="nbP" type="number" placeholder="ราคาขาย"><input id="nbC" type="number" step="any" placeholder="ทุน/ชิ้น"><input id="nbU" value="ชิ้น" placeholder="หน่วย"></div>

    const g={id:uid(),name:n,cat:'ซื้อมาขาย',price:+val('nbP')||0,cost:+val('nbC')||0,unit:val('nbU').trim()||'ชิ้น',carry:document.getElementById('nbK').checked,par:0,active:true,src:'buy'};S.goods.push(g);syncProducts();

/* ================= SCAN BILL (AI อ่านบิลด้วย Gemini) ================= */
const SCAN_T={expense_receipt:['ใบเสร็จ / รายจ่าย','🧾'],supplier_invoice:['บิลรับสินค้ามาขาย','📦'],transfer_slip:['สลิปโอนเงิน','💸'],pos_summary:['ใบสรุปยอด POS','🖨'],unknown:['ไม่แน่ใจประเภท','❓']};
let _scan=null;
function scanBill(hint){if(!LIVE)return modal(`<h2>📷 สแกนบิลด้วย AI</h2><p style="line-height:1.7;margin-bottom:14px">ฟีเจอร์นี้ใช้ได้ในระบบจริง (natty-aof.github.io/oha-artisan-bread) เพราะต้องให้เซิร์ฟเวอร์ของร้านส่งรูปไปให้ Gemini อ่าน — หน้าพรีวิวนี้ไม่ได้เชื่อมเซิร์ฟเวอร์</p><div class="row end"><button class="btn" onclick="closeModal()">ปิด</button></div>`,440);
  if(SERVER_V<7)return modal(`<h2>📷 สแกนบิลด้วย AI</h2><p style="line-height:1.7;margin-bottom:14px">ต้องอัปเดตโค้ด Apps Script (Code.gs) เป็นเวอร์ชันล่าสุด และ Deploy เวอร์ชันใหม่ก่อน — แจ้งอ๊อฟ</p><div class="row end"><button class="btn" onclick="closeModal()">ปิด</button></div>`,440);
  modal(`<h2>📷 สแกนบิลด้วย AI</h2><p style="font-size:14px;color:var(--ink2);line-height:1.7;margin-bottom:12px">ถ่ายรูปให้เห็นทั้งใบ ชัด ไม่เอียง — ระบบจะอ่านแล้วกรอกฟอร์มให้ <b>คุณตรวจก่อนบันทึกทุกครั้ง</b></p>
  <label class="f"><span>ประเภทเอกสาร</span><select id="scH"><option value="auto">ให้ AI ดูเอง</option>${Object.entries(SCAN_T).filter(([k])=>k!=='unknown').map(([k,[n]])=>`<option value="${k}" ${hint===k?'selected':''}>${n}</option>`).join('')}</select></label>
  <label class="btn p" style="cursor:pointer;width:100%;padding:16px;font-size:16px">📷 ถ่ายรูป / เลือกรูปบิล<input type="file" accept="image/*" capture="environment" style="display:none" onchange="doScan(this.files[0])"></label>
  <div class="row end" style="margin-top:12px"><button class="btn" onclick="closeModal()">ยกเลิก</button></div>`,460)}
function imgToData(file,max,q){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>rej(new Error('เปิดรูปไม่ได้'));im.src=rd.result};rd.readAsDataURL(file)})}
async function doScan(file){if(!file)return;const hint=val('scH');
  modal(`<div style="text-align:center;padding:26px 0"><div class="spin"></div><h2 style="margin:14px 0 4px">AI กำลังอ่านบิล…</h2><p style="color:var(--muted);font-size:14px">ประมาณ 5–20 วินาที</p></div>`,400);
  try{const big=await imgToData(file,1600,.8);const thumb=await new Promise(r=>shrinkTo(file,30000,r));
    const res=await api('scan',{image:big,hint,goods:GA().map(g=>g.name),cats:EXP_CATS});_scan={d:res.data||{},img:thumb};scanReview()}
  catch(e){modal(`<h2 style="color:var(--bad)">อ่านบิลไม่สำเร็จ</h2><p style="line-height:1.7;margin-bottom:14px">${esc(e.message)}</p><div class="row end"><button class="btn" onclick="closeModal()">ปิด</button><button class="btn p" onclick="scanBill('${hint}')">ลองใหม่</button></div>`,440)}}
function scanReview(){const d=_scan.d,t=SCAN_T[d.type]||SCAN_T.unknown,items=d.items||[],own=isOwner();
  modal(`<div class="row" style="gap:12px;align-items:flex-start"><img src="${_scan.img}" onclick="viewPhoto(this.src)" style="width:84px;height:84px;object-fit:cover;border-radius:10px;cursor:zoom-in;flex:none">
   <div class="sp"><div style="font-size:13px;color:var(--muted)">AI อ่านได้ว่าเป็น</div><h2 style="margin:2px 0">${t[1]} ${t[0]}</h2><div style="font-size:13.5px;color:var(--ink2)">${d.vendor?esc(d.vendor)+' · ':''}${d.date?thDate(d.date):''}${d.time?' '+esc(d.time):''}${+d.total?` · <b>฿${money(d.total)}</b>`:''}${d.confidence!=null?` · ความมั่นใจ ${Math.round((+d.confidence||0)*100)}%`:''}</div></div></div>
  ${items.length?`<div style="max-height:34vh;overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px"><table><tr><th>รายการ</th><th class="n">จำนวน</th><th class="n">ราคา/หน่วย</th><th class="n">รวม</th></tr>${items.map(i=>`<tr><td>${esc(i.name)}${i.match?` <span class="pill olive">${esc(i.match)}</span>`:''}</td><td class="n">${num(i.qty,2)} ${esc(i.unit||'')}</td><td class="n">${money(i.unit_price)}</td><td class="n">${money(i.amount)}</td></tr>`).join('')}</table></div>`:''}
  ${d.type==='transfer_slip'&&d.slip?`<div class="note" style="margin-top:10px">โอน ฿${money(d.slip.amount||d.total)} · จาก ${esc(d.slip.from_name||'-')} → ${esc(d.slip.to_name||'-')}${d.slip.bank?' · '+esc(d.slip.bank):''}${d.slip.ref?' · Ref '+esc(d.slip.ref):''}</div>`:''}
  ${d.notes?`<div class="hint">หมายเหตุจาก AI: ${esc(d.notes)}</div>`:''}
  <div style="font-size:13px;color:var(--ink2);margin:14px 0 6px">บันทึกเป็น:</div>
  <div class="grid g2" style="gap:8px">
   <button class="btn ${d.type==='expense_receipt'||d.type==='unknown'?'p':''}" onclick="scanTo('expense')">🧾 รายจ่าย</button>
   ${own?`<button class="btn ${d.type==='supplier_invoice'?'p':''}" onclick="scanTo('recv')">📦 รับสินค้ามาขาย</button>`:''}
   <button class="btn ${d.type==='pos_summary'?'p':''}" onclick="scanTo('pos')">🖨 สรุปยอดขายประจำวัน</button>
   ${own?`<button class="btn ${d.type==='transfer_slip'?'p':''}" onclick="scanTo('payment')">💸 รับชำระจากลูกค้าส่ง</button>`:''}
  </div><div class="row end" style="margin-top:12px"><button class="btn g" onclick="closeModal()">ยกเลิก</button></div>`,600)}
const d10=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?s:today();
function scanTo(kind){const d=_scan.d,items=d.items||[];
  if(kind==='expense'){const cat=EXP_CATS.includes(d.category)?d.category:'เบ็ดเตล็ด',amt=+d.total||+(d.slip||{}).amount||items.reduce((a,i)=>a+(+i.amount||0),0);
    const desc=(d.description||'')||((d.vendor?d.vendor+': ':'')+items.slice(0,4).map(i=>i.name).join(', '))||'รายจ่ายจากบิล';
    expForm();setTimeout(()=>{const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v};set('xD',d10(d.date));set('xA',amt||'');set('xT',desc.slice(0,120));set('xC',cat);set('xN',[d.vendor,d.slip&&d.slip.ref?'Ref '+d.slip.ref:''].filter(Boolean).join(' · '));
      if(d.payment==='transfer'||d.type==='transfer_slip'){const r=document.querySelector('input[name=xS][value=shop_bank]');if(r&&isOwner())r.checked=true}
      window._rc=_scan.img;const p=document.getElementById('xRP');if(p)p.innerHTML=photoTag(_scan.img,56);toast('กรอกจากบิลแล้ว — ตรวจแล้วกดบันทึก')},30);return}
  if(kind==='recv'){recvForm(d10(d.date));setTimeout(()=>{document.getElementById('rvF').value=d.vendor||'';
      _rv=items.filter(i=>+i.qty>0).map(i=>{const g=i.match?S.goods.find(x=>x.name===i.match):null,gid=g?g.id:autoMatch(i.name);return {gid:gid&&gid!=='-'?gid:'',qty:+i.qty,cost:+i.unit_price||(+i.amount&&+i.qty?+i.amount/ +i.qty:''),_n:i.name}});
      if(!_rv.length)_rv=[{gid:'',qty:'',cost:''}];rvRows();const miss=_rv.filter(x=>!x.gid&&x._n);
      if(miss.length)document.getElementById('rvNew').innerHTML=`<div class="note mb" style="background:var(--warn-l)">ยังจับคู่ไม่ได้: ${miss.map(x=>esc(x._n)+' ×'+x.qty).join(', ')} — เลือกสินค้าเอง หรือกด “+ สินค้าใหม่”</div>`;
      toast('กรอกจากบิลแล้ว — ตรวจแล้วกดบันทึก')},30);return}
  if(kind==='pos'){const dd=isOwner()?d10(d.date):today();if(!isOwner()&&d.date&&d.date!==today())toast('พนักงานลงได้เฉพาะยอดวันนี้ — ใช้วันที่วันนี้');
    ui.dsDate=dd;ui.dsDraft=null;const D=dsDraftFor(dd);D.qty={};D.amt={};D.others=[];D.src='pos';D.dirty=1;

/* ================= MEMBERS (สมาชิก / สะสมแต้ม) ================= */
const MS=()=>S.settings.member;
function tierOf(m){const ts=MS().tiers.slice().sort((a,b)=>b.min-a.min);return ts.find(t=>m.spent>=t.min)||ts[ts.length-1]}
function nextTier(m){return MS().tiers.slice().sort((a,b)=>a.min-b.min).find(t=>t.min>m.spent)}
const tierPill=m=>{const t=tierOf(m);return `<span class="pill ${t.cls||'neu'}">${esc(t.name)}</span>`};
const isBday=m=>m.bday&&m.bday.slice(5,7)===today().slice(5,7);
const fmtPhone=p=>p&&p.length===10?p.slice(0,3)+'-'+p.slice(3,6)+'-'+p.slice(6):p;
const ago=iso=>{if(!iso)return '—';const d=daysBetween(iso.slice(0,10),today())-1;return d<=0?'วันนี้':d===1?'เมื่อวาน':d<31?d+' วันก่อน':thDate(iso.slice(0,10))};
function nextCode(){const n=S.members.reduce((a,m)=>Math.max(a,+m.code.replace(/\D/g,'')||0),0)+1;return 'OHA'+String(n).padStart(4,'0')}
function memberSpend(from,to){return S.memberTx.filter(x=>x.type==='earn'&&x.at.slice(0,10)>=from&&x.at.slice(0,10)<=to).reduce((a,x)=>a+x.amount,0)}
function seedMembers(){
  const names=['คุณนภา','คุณกิตติ','คุณพิมพ์ชนก','คุณธนพล','คุณอรุณี','คุณวรเชษฐ์','คุณมาลี','คุณศุภชัย','คุณปิยะนุช','คุณเอกชัย','คุณจันทร์เพ็ญ','คุณสมศักดิ์','Ms. Anna','Mr. James','คุณรัตนา','คุณภานุ','คุณกัญญา','คุณวีระ','คุณสุดารัตน์','คุณณัฐวุฒิ','คุณลลิตา','คุณชยพล','คุณแพรวา','คุณอนันต์'];
  const t=today(), members=[], tx=[];
  names.forEach((name,i)=>{const join=addDays(t,-Math.floor(5+Math.random()*150));
    const by=1965+Math.floor(Math.random()*38), bm=pad(1+Math.floor(Math.random()*12)), bd=pad(1+Math.floor(Math.random()*28));
    const m={id:uid(),code:'OHA'+String(i+1).padStart(4,'0'),name,phone:'0'+['8','9','6'][i%3]+String(Math.floor(1e7+Math.random()*9e7)).slice(0,8),bday:i%4===3?'':by+'-'+(i%6===0?t.slice(5,7):bm)+'-'+bd,line:'',note:'',join,points:0,spent:0,visits:0,last:null,consent:true};
    const span=daysBetween(join,t), v=Math.max(1,Math.floor(Math.random()*Math.min(30,span/3)));
    const days=[...Array(v)].map(()=>addDays(join,Math.floor(Math.random()*span))).sort();
    days.forEach(d=>{const amt=Math.round((80+Math.random()*520)/5)*5, pts=Math.floor(amt/25);
      const at=new Date(d+'T'+pad(7+Math.floor(Math.random()*10))+':'+pad(Math.floor(Math.random()*60))+':00').toISOString();
      tx.push({id:uid(),memberId:m.id,type:'earn',amount:amt,points:pts,note:'',uid:'u3',at});m.points+=pts;m.spent+=amt;m.visits++;m.last=at;
      if(m.points>=70&&Math.random()<.25){tx.push({id:uid(),memberId:m.id,type:'redeem',amount:0,points:-60,note:'Croissant ฟรี 1 ชิ้น',uid:'u3',at});m.points-=60}});
    members.push(m)});
  return {members,memberTx:tx.sort((a,b)=>a.at.localeCompare(b.at))};
}

  <div class="grid g21">

        ${bdays.length?bdays.map(m=>`<div class="list-item" style="cursor:pointer" onclick="openMember('${m.id}')"><div class="sp"><div class="t">${esc(m.name)}</div><div class="s">${+m.bday.slice(8)} ${new Date(m.bday+'T00:00').toLocaleDateString('th-TH',{month:'short'})} · ${fmtPhone(m.phone)}</div></div>${tierPill(m)}</div>`).join(''):'<div class="empty">ไม่มีสมาชิกเกิดเดือนนี้</div>'}

        <div class="hint">ทุก ฿${MS().bahtPerPoint} = 1 แต้ม × ตัวคูณตามระดับ</div></div>
      <div class="card"><h3>ของรางวัล</h3>${MS().rewards.map(r=>`<div class="list-item"><div class="sp">${esc(r.name)}</div><b class="en">${r.points} แต้ม</b></div>`).join('')||'<div class="empty">ยังไม่มีของรางวัล</div>'}</div>

function renderMemberList(){const el=document.getElementById('mList');if(!el)return;

  list.sort((a,b)=>s==='points'?b.points-a.points:s==='spent'?b.spent-a.spent:s==='new'?b.join.localeCompare(a.join):(b.last||'').localeCompare(a.last||''));

    else{const nm={id:uid(),code:nextCode(),...o,join:today(),points:0,spent:0,visits:0,last:null,consent:true,by:ME.id};S.members.push(nm);save();toast('สมัครสมาชิกแล้ว — รหัส '+nm.code);openMember(nm.id)}
    if(route==='members')renderMemberList()};
  if(id&&isOwner())document.getElementById('mDel').onclick=()=>confirmBox('ลบสมาชิก “'+esc(m.name)+'” และประวัติแต้มทั้งหมด?',()=>{S.members=S.members.filter(x=>x.id!==id);S.memberTx=S.memberTx.filter(x=>x.memberId!==id);save();toast('ลบแล้ว');rerender()});
}
function memberSettings(){const s=MS();
  modal(`<h2>ตั้งค่าแต้ม & ของรางวัล</h2>
  <label class="f"><span>ยอดซื้อกี่บาท = 1 แต้ม</span><input type="number" min="1" id="sB" value="${s.bahtPerPoint}"></label>
  <label class="f"><span>ระดับสมาชิก (ชื่อ · ยอดสะสมขั้นต่ำ · ตัวคูณแต้ม)</span></label>
  ${s.tiers.map((t,i)=>`<div class="grid g3" style="gap:8px;margin-bottom:8px"><input class="tN" value="${esc(t.name)}"><input class="tM" type="number" value="${t.min}" ${i===0?'disabled':''}><input class="tX" type="number" step="0.05" value="${t.mult}"></div>`).join('')}
  <label class="f" style="margin-top:8px"><span>ของรางวัล — บรรทัดละรายการ “ชื่อ | แต้ม”</span><textarea id="sR" rows="5">${esc(s.rewards.map(r=>r.name+' | '+r.points).join('\n'))}</textarea></label>
  <label class="f"><span>สิทธิ์เดือนเกิด</span><input id="sP" value="${esc(s.bdayPerk)}"></label>
  <div class="row end"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="sOk">บันทึก</button></div>`,520);
  document.getElementById('sOk').onclick=()=>{s.bahtPerPoint=Math.max(1,+val('sB')||25);
    const N=[...document.querySelectorAll('.tN')],M=[...document.querySelectorAll('.tM')],X=[...document.querySelectorAll('.tX')];
    s.tiers.forEach((t,i)=>{t.name=N[i].value.trim()||t.name;if(i)t.min=Math.max(0,+M[i].value||0);t.mult=Math.max(0,+X[i].value||1)});
    s.rewards=val('sR').split('\n').map(l=>{const [n,p]=l.split('|');return {name:(n||'').trim(),points:Math.round(+p)}}).filter(r=>r.name&&r.points>0);
    s.bdayPerk=val('sP').trim();save();closeModal();toast('บันทึกการตั้งค่าแล้ว');rerender()};
}

/* ================= LIVE MODE (Google Sheets ผ่าน Apps Script) ================= */
const COLLS=['users','items','moves','sales','attendance','ot','leaves','reports','goods','pmoves','wcust','worders','members','memberTx','expenses','bills','shifts'];
let TOKEN=null,SNAP=null,LAST_TS=0,syncing=false,syncFail=0,pollT=null,syncState='ok';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
async function api(action,body){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:TOKEN},body||{}))});
  let j;try{j=await r.json()}catch(e){throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้')}
  if(!j.ok){if(j.auth&&TOKEN&&action!=='login'){forceRelogin(j.error)}const e=new Error(j.error||'เกิดข้อผิดพลาด');e.auth=j.auth;throw e}return j}
function emptyState(){return applyDefaults({users:[],items:[],moves:[],sales:[],attendance:[],ot:[],leaves:[],reports:[],goods:[],pmoves:[],wcust:[],worders:[],members:[],memberTx:[],expenses:[],bills:[],shifts:[],posAlias:{},payroll:{},dayClosed:{},products:[],
  settings:{shiftStart:'06:00',stdHours:8,breakHours:1,quota:{'ลาป่วย':30,'ลากิจ':6,'ลาพักร้อน':6}},menuV:2,namesV:1,ownersV:1})}
function kvOf(s){const o={settings:JSON.stringify(s.settings)};['posAlias','payroll'].forEach(k=>{if(s[k]&&Object.keys(s[k]).length)o[k]=JSON.stringify(s[k])});Object.keys(s.dayClosed||{}).forEach(d=>o['dayClosed:'+d]=JSON.stringify(s.dayClosed[d]));return o}
function snapOf(s){const m={};COLLS.forEach(c=>{m[c]={};(s[c]||[]).forEach(r=>m[c][r.id]=JSON.stringify(r))});m.kv=kvOf(s);return m}
function diff(){const ups={},dels={},kv={},kvDel=[];let n=0;if(!SNAP)return {n:0};
  COLLS.forEach(c=>{const cur={};(S[c]||[]).forEach(r=>{const j=JSON.stringify(r);cur[r.id]=1;if(SNAP[c][r.id]!==j){(ups[c]=ups[c]||[]).push(r);n++}});
    Object.keys(SNAP[c]).forEach(id=>{if(!cur[id]){(dels[c]=dels[c]||[]).push(id);n++}})});
  const k=kvOf(S);Object.keys(k).forEach(key=>{if(SNAP.kv[key]!==k[key]){kv[key]=JSON.parse(k[key]);n++}});Object.keys(SNAP.kv).forEach(key=>{if(!(key in k)){kvDel.push(key);n++}});
  return {ups,dels,kv,kvDel,n}}
function pendingIds(){const d=diff(),m={};Object.keys(d.ups||{}).forEach(c=>d.ups[c].forEach(r=>m[c+'/'+r.id]=1));Object.keys(d.dels||{}).forEach(c=>d.dels[c].forEach(id=>m[c+'/'+id]=1));return m}
/* นำข้อมูลจากเซิร์ฟเวอร์มาใส่ (ข้ามรายการที่เรากำลังแก้ค้างอยู่) */
function applyRows(data,kv,skipPending){const pend=skipPending?pendingIds():{};let ch=false;
  Object.keys(data||{}).forEach(c=>{if(!S[c])return;(data[c]||[]).forEach(rec=>{if(pend[c+'/'+rec.id])return;const i=S[c].findIndex(x=>x.id===rec.id);
    if(rec._deleted){if(i>=0){S[c].splice(i,1);ch=true}delete SNAP[c][rec.id];return}
    const j=JSON.stringify(rec);if(i>=0){if(JSON.stringify(S[c][i])!==j){S[c][i]=rec;ch=true}}else{S[c].push(rec);ch=true}SNAP[c][rec.id]=j})});
  Object.keys(kv||{}).forEach(k=>{const v=kv[k];
    if(k==='posAlias'||k==='payroll'){if(v){const j=JSON.stringify(v);if(SNAP.kv[k]!==j){S[k]=v;SNAP.kv[k]=j;ch=true}}return}
    if(k==='settings'){if(v){const j=JSON.stringify(v);if(SNAP.kv.settings!==j){S.settings=v;applyDefaults(S);SNAP.kv.settings=JSON.stringify(S.settings);ch=true}}}
    else if(k.indexOf('dayClosed:')===0){const d=k.slice(10);if(v==null){if(S.dayClosed[d]){delete S.dayClosed[d];ch=true}delete SNAP.kv[k]}else{const j=JSON.stringify(v);if(SNAP.kv[k]!==j){S.dayClosed[d]=v;SNAP.kv[k]=j;ch=true}}}});
  if(ch){DIRTY++;syncProducts();if(ME)ME=S.users.find(u=>u.id===ME.id)||ME}
  return ch}
async function flush(){if(!LIVE||!SNAP||!TOKEN||syncing)return;const d=diff();if(!d.n){setSync('ok');return}
  syncing=true;setSync('saving');
  const sent={};Object.keys(d.ups).forEach(c=>d.ups[c].forEach(r=>(sent[c]=sent[c]||{})[r.id]=JSON.stringify(r)));
  try{const res=await api('sync',{ups:d.ups,dels:d.dels,kv:d.kv,kvDel:d.kvDel});
    Object.keys(sent).forEach(c=>Object.assign(SNAP[c],sent[c]));
    Object.keys(d.dels).forEach(c=>d.dels[c].forEach(id=>delete SNAP[c][id]));
    Object.keys(d.kv).forEach(k=>SNAP.kv[k]=JSON.stringify(d.kv[k]));d.kvDel.forEach(k=>delete SNAP.kv[k]);
    if(applyRows(res.fixed,null,false)&&ME&&!modalOpen()&&!isTyping())rerender();
    syncFail=0;syncing=false;
    if(diff().n)return flush();setSync('ok');
  }catch(e){syncing=false;syncFail++;setSync('error',e.message);if(!e.auth)setTimeout(flush,Math.min(30000,4000*syncFail))}
}
async function poll(){if(!LIVE||!TOKEN||!ME||syncing||document.hidden)return;if(diff().n)return flush();
  try{const r=await api('changes',{since:LAST_TS});LAST_TS=r.ts;const ch=applyRows(r.data,r.kv,true);
    if(ch&&!modalOpen()&&!isTyping())rerender();if(syncState!=='saving')setSync('ok')}catch(e){if(!e.auth)setSync('error',e.message)}}
function startPolling(){clearInterval(pollT);pollT=setInterval(poll,30000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&LIVE&&ME)poll()});
window.addEventListener('beforeunload',e=>{if(LIVE&&SNAP&&diff().n){flush();e.preventDefault();e.returnValue=''}});
const modalOpen=()=>document.getElementById('mask').classList.contains('show');
const isTyping=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!a.closest('#mask')};
function setSync(st,msg){syncState=st;const t={ok:['●','บันทึกแล้ว','var(--good)'],pending:['●','รอบันทึก…','var(--warn)'],saving:['◌','กำลังบันทึก…','var(--warn)'],error:['⚠','ยังไม่ได้บันทึก — กำลังลองใหม่','var(--bad)']}[st];
  document.querySelectorAll('.syncdot').forEach(el=>{el.innerHTML=`<span style="color:${t[2]}">${t[0]}</span> ${t[1]}`;el.title=msg||''})}
async function loadAll(){const r=await api('load');S=emptyState();COLLS.forEach(c=>S[c]=r.data[c]||[]);
  Object.keys(r.kv||{}).forEach(k=>{if(k==='posAlias'||k==='payroll')S[k]=r.kv[k];else if(k==='settings')S.settings=r.kv[k];else if(k.indexOf('dayClosed:')===0)S.dayClosed[k.slice(10)]=r.kv[k]});
  applyDefaults(S);G().sim='off';LAST_TS=r.ts;SNAP=snapOf(S);
  if(!r.kv||!r.kv.settings)delete SNAP.kv.settings;          // ส่งค่าตั้งต้นขึ้นเซิร์ฟเวอร์ครั้งแรก
  ME_ADMIN=!!(r.me&&r.me.admin);SERVER_V=r.v||0;return r.me}
function bootstrapIfEmpty(){if(!isOwner())return;let ch=false;
  if(!S.goods.length){S.goods=defaultGoods();syncProducts();ch=true}
  if(!S.items.length){S.items=defaultItems(false);ch=true}
  if(seedSourdoughRecipe(S))ch=true;
  if(ch||!SNAP.kv.settings)save()}
function showBoot(msg,err){const b=document.getElementById('bootMsg');if(!b)return;b.style.display='block';b.innerHTML=err?`<div style="color:#F3B6A8">${msg}</div><button class="btn" style="margin-top:12px" onclick="location.reload()">ลองใหม่</button>`:`<div class="spin" style="border-color:rgba(255,255,255,.15);border-top-color:#E58B5C"></div><div style="margin-top:12px">${msg}</div>`;document.querySelector('.login-card').style.display=err||msg?'none':''}
function hideBoot(){const b=document.getElementById('bootMsg');if(b)b.style.display='none';document.querySelector('.login-card').style.display=''}
async function bootLive(){showBoot('กำลังเชื่อมต่อระบบ…');
  try{const r=await api('users');S=emptyState();S.users=r.users}catch(e){return showBoot('เชื่อมต่อระบบไม่ได้: '+esc(e.message),true)}
  TOKEN=lsGet('oha-token');
  if(TOKEN){try{showBoot('กำลังโหลดข้อมูล…');const me=await loadAll();ME=S.users.find(u=>u.id===me.id);if(ME){hideBoot();startApp();bootstrapIfEmpty();startPolling();return}}catch(e){}}
  TOKEN=null;lsSet('oha-token',null);hideBoot();renderLogin()}
async function doLoginLive(){if(!pickId)return toast('เลือกชื่อผู้ใช้ก่อน');const pin=val('pin');if(!pin)return toast('ใส่ PIN');
  const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='กำลังเข้า…';
  try{const r=await api('login',{uid:pickId,pin});TOKEN=r.token;lsSet('oha-token',TOKEN);document.getElementById('pin').value='';
    showBoot('กำลังโหลดข้อมูล…');await loadAll();ME=S.users.find(u=>u.id===r.user.id);hideBoot();startApp();bootstrapIfEmpty();startPolling()}
  catch(e){hideBoot();toast(e.message)}finally{b.disabled=false;b.textContent='เข้าระบบ'}}
function forceRelogin(msg){if(!ME)return;TOKEN=null;lsSet('oha-token',null);clearInterval(pollT);ME=null;closeModal();document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';renderLogin();toast(msg||'กรุณาเข้าสู่ระบบใหม่')}
function changePinForm(){modal(`<h2>เปลี่ยน PIN ของฉัน</h2><label class="f"><span>PIN เดิม</span><input type="password" inputmode="numeric" maxlength="6" id="cpO"></label><label class="f"><span>PIN ใหม่ (4–6 หลัก)</span><input type="password" inputmode="numeric" maxlength="6" id="cpN"></label><label class="f"><span>ยืนยัน PIN ใหม่</span><input type="password" inputmode="numeric" maxlength="6" id="cpN2"></label>
  <div class="row end"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="cpOk">บันทึก</button></div>`,400);
  document.getElementById('cpOk').onclick=async()=>{const o=val('cpO'),n=val('cpN');if(!/^\d{4,6}$/.test(n))return toast('PIN ต้องเป็นตัวเลข 4–6 หลัก');if(n!==val('cpN2'))return toast('PIN ใหม่ไม่ตรงกัน');
    if(!LIVE){if(o!==ME.pin)return toast('PIN เดิมไม่ถูกต้อง');ME.pin=n;save();closeModal();return toast('เปลี่ยน PIN แล้ว')}
    try{await api('changePin',{old:o,pin:n});closeModal();toast('เปลี่ยน PIN แล้ว')}catch(e){toast(e.message)}}}
async function viewRemotePhoto(id){modal(`<div style="text-align:center;padding:30px"><div class="spin"></div><div style="margin-top:10px;color:var(--muted)">กำลังโหลดรูป…</div></div>`,380);
  try{const r=await api('photo',{id});viewPhoto(r.dataUrl)}catch(e){closeModal();toast(e.message)}}
const photoTag=(src,s)=>!src?'':src.indexOf('drive:')===0?`<button class="btn sm g" title="ดูรูปยืนยัน" onclick="viewRemotePhoto('${src.slice(6)}')" style="padding:2px 6px">📷</button>`:`<img src="${src}" alt="รูปยืนยัน" onclick="viewPhoto(this.src)" style="width:${s}px;height:${s}px;border-radius:6px;object-fit:cover;vertical-align:middle;cursor:zoom-in">`;

/* ---------- boot ---------- */
(function(){if(LIVE){document.getElementById('pinHint').style.display='none';bootLive()}else{let id=null;try{id=sessionStorage.getItem('oha-me')}catch(e){}
  const u=id&&S.users.find(x=>x.id===id); if(u){ME=u;startApp()}else renderLogin()}
  window.addEventListener('resize',()=>{if(ME&&(route==='dashboard'||route==='sales'))(AFTER[route])()});
})();
</script>
